<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Senior Check Design</title>
    <style>
      /* ---------------------------------------------------------------------------
   Senior Check Design : UI calquée au pixel sur la modale « Check designs »
   Métriques relevées sur la capture officielle (2x) : header 40, barre
   d'onglets 40, onglets 24 (pastille 16, rayon 5), lignes 24 espacées de 8,
   cellules rayon 5 et padding 6, pastille couleur 14 rayon 2, flèche 9 px,
   badge 14 px, footer 40, bouton 24 avec compteur.
   Les couleurs utilisent les variables de thème Figma avec, en repli, les
   valeurs mesurées sur la capture.
   --------------------------------------------------------------------------- */
:root {
  --bg: var(--figma-color-bg, #ffffff);
  --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
  --bg-3: var(--figma-color-bg-tertiary, #e6e6e6);
  --bg-hover: var(--figma-color-bg-hover, rgba(0, 0, 0, 0.05));
  --bg-selected: var(--figma-color-bg-selected, #e5f4ff);
  --bg-brand: var(--figma-color-bg-brand, #0d99ff);
  --bg-brand-hover: var(--figma-color-bg-brand-hover, #007be5);
  --bg-brand-3: var(--figma-color-bg-brand-tertiary, #e5f4ff);
  --bg-danger: var(--figma-color-bg-danger, #f24822);
  --bg-warning: var(--figma-color-bg-warning, #ffcd29);
  --bg-success: var(--figma-color-bg-success, #14ae5c);
  --bg-inverse: var(--figma-color-bg-inverse, #2c2c2c);
  --bg-disabled: var(--figma-color-bg-disabled, #e6e6e6);
  --text: var(--figma-color-text, #1a1a1a);
  --text-strong: var(--figma-color-text, #000000);
  --text-2: var(--figma-color-text-secondary, #7f7f7f);
  --text-3: var(--figma-color-text-tertiary, #b3b3b3);
  --text-brand: var(--figma-color-text-brand, #007be5);
  --text-danger: var(--figma-color-text-danger, #dc3412);
  --text-warning: var(--figma-color-text-warning, #a8720b);
  --text-success: var(--figma-color-text-success, #009951);
  --text-component: var(--figma-color-text-component, #7b3ff2);
  --text-onbrand: var(--figma-color-text-onbrand, #ffffff);
  --text-oninverse: var(--figma-color-text-oninverse, #ffffff);
  --text-disabled: var(--figma-color-text-disabled, rgba(0, 0, 0, 0.3));
  --border: var(--figma-color-border, #e6e6e6);
  --border-strong: var(--figma-color-border-strong, #2c2c2c);
  --border-brand: var(--figma-color-border-brand, #0d99ff);
  --border-success: var(--figma-color-border-success, #b9ebc6);
  --border-component: var(--figma-color-border-component, #dcd0ff);
  --icon: var(--figma-color-icon, #1a1a1a);
  --icon-2: var(--figma-color-icon-secondary, #7f7f7f);
  --icon-3: var(--figma-color-icon-tertiary, #b2b2b2);
  --icon-brand: var(--figma-color-icon-brand, #007be5);

  --font: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --fs: 11px;
  --radius: 5px;
  --radius-xs: 2px;
  --cell-h: 24px;
  --row-gap: 8px;
  --pad: 16px;

  --d-fast: 100ms;
  --d-fix: 180ms;
  --d-panel: 160ms;
  --d-toast-in: 180ms;
  --d-toast-out: 140ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --shadow-1: 0 1px 3px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.06);
  --shadow-2: 0 6px 20px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.08);
  --focus-ring: 0 0 0 1px var(--bg), 0 0 0 3px var(--border-brand);
  /* Liseré des cadres rendus dans la vue Comparer. */
  --cmp-frame-border: rgba(0, 0, 0, 0.12);
}
html.figma-dark {
  --cmp-frame-border: rgba(255, 255, 255, 0.16);
}

/* ---- Thèmes forcés ------------------------------------------------------
   Le plugin suit Figma par défaut (classes figma-light / figma-dark). Un thème
   forcé sur <html> (réglage « Thème du plugin ») ou sur le volet Comparer
   (thème de la vue) redéfinit directement les alias ci-dessus : palette
   claire mesurée sur Check designs, palette sombre de Figma.
   ------------------------------------------------------------------------- */
html[data-theme='light'],
.compare[data-theme='light'] {
  color-scheme: light;
  --bg: #ffffff;
  --bg-2: #f5f5f5;
  --bg-3: #e6e6e6;
  --bg-hover: rgba(0, 0, 0, 0.05);
  --bg-selected: #e5f4ff;
  --bg-brand: #0d99ff;
  --bg-brand-hover: #007be5;
  --bg-brand-3: #e5f4ff;
  --bg-danger: #f24822;
  --bg-warning: #ffcd29;
  --bg-success: #14ae5c;
  --bg-inverse: #2c2c2c;
  --bg-disabled: #e6e6e6;
  --text: #1a1a1a;
  --text-strong: #000000;
  --text-2: #7f7f7f;
  --text-3: #b3b3b3;
  --text-brand: #007be5;
  --text-danger: #dc3412;
  --text-warning: #a8720b;
  --text-success: #009951;
  --text-component: #7b3ff2;
  --text-onbrand: #ffffff;
  --text-oninverse: #ffffff;
  --text-disabled: rgba(0, 0, 0, 0.3);
  --border: #e6e6e6;
  --border-strong: #2c2c2c;
  --border-brand: #0d99ff;
  --border-success: #b9ebc6;
  --border-component: #dcd0ff;
  --icon: #1a1a1a;
  --icon-2: #7f7f7f;
  --icon-3: #b2b2b2;
  --icon-brand: #007be5;
  --focus-ring: 0 0 0 1px var(--bg), 0 0 0 3px var(--border-brand);
  --cmp-frame-border: rgba(0, 0, 0, 0.12);
}
html[data-theme='dark'],
.compare[data-theme='dark'] {
  color-scheme: dark;
  --bg: #2c2c2c;
  --bg-2: #383838;
  --bg-3: #444444;
  --bg-hover: rgba(255, 255, 255, 0.08);
  --bg-selected: #394a5e;
  --bg-brand: #0c8ce9;
  --bg-brand-hover: #0a6dc2;
  --bg-brand-3: #1d3a55;
  --bg-danger: #f24822;
  --bg-warning: #ffcd29;
  --bg-success: #14ae5c;
  --bg-inverse: #e6e6e6;
  --bg-disabled: rgba(255, 255, 255, 0.1);
  --text: rgba(255, 255, 255, 0.9);
  --text-strong: #ffffff;
  --text-2: rgba(255, 255, 255, 0.6);
  --text-3: rgba(255, 255, 255, 0.4);
  --text-brand: #7cc4ff;
  --text-danger: #ff8a7a;
  --text-warning: #ffd36a;
  --text-success: #79d297;
  --text-component: #c7a9ff;
  --text-onbrand: #ffffff;
  --text-oninverse: #1e1e1e;
  --text-disabled: rgba(255, 255, 255, 0.4);
  --border: #444444;
  --border-strong: #a6a6a6;
  --border-brand: #0c8ce9;
  --border-success: #2f6b44;
  --border-component: #6c49d2;
  --icon: rgba(255, 255, 255, 0.9);
  --icon-2: rgba(255, 255, 255, 0.6);
  --icon-3: rgba(255, 255, 255, 0.35);
  --icon-brand: #7cc4ff;
  --focus-ring: 0 0 0 1px var(--bg), 0 0 0 3px var(--border-brand);
  --cmp-frame-border: rgba(255, 255, 255, 0.16);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --d-fast: 0ms;
    --d-fix: 0ms;
    --d-panel: 0ms;
    --d-toast-in: 0ms;
    --d-toast-out: 0ms;
  }
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}
body {
  font: 400 var(--fs) / 16px var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: default;
  border: 0;
  background: none;
  padding: 0;
}
:focus {
  outline: none;
}
:focus-visible {
  box-shadow: var(--focus-ring);
}
.num {
  font-variant-numeric: tabular-nums;
}
.muted {
  color: var(--text-2);
}
.grow {
  flex: 1;
  min-width: 0;
}
.icon {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.25;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.ellipsis {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---- Structure ---------------------------------------------------------- */
#app {
  height: 100%;
  display: flex;
  flex-direction: row;
  position: relative;
}
/* Colonne principale (liste) ; le volet Comparer se place à sa droite. */
.main {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}
#app.is-collapsed .header {
  border-bottom: 0;
}
body.is-resizing,
body.is-resizing * {
  cursor: inherit !important;
  user-select: none;
}
.header {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 40px;
  padding: 0 8px 0 var(--pad);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.title-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.title {
  margin: 0;
  font-size: var(--fs);
  font-weight: 600;
  line-height: 16px;
  white-space: nowrap;
  color: var(--text);
}
.score {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 16px;
  padding: 0 5px 0 4px;
  border-radius: var(--radius);
  background: var(--bg-2);
  color: var(--text);
}
.score::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--bg-success);
}
.score[data-level='mid']::before {
  background: var(--bg-warning);
}
.score[data-level='low']::before {
  background: var(--bg-danger);
}
.icon-btn {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--icon);
  transition: background var(--d-fast) var(--ease-out), color var(--d-fast) var(--ease-out);
}
.icon-btn:hover:not(:disabled) {
  background: var(--bg-hover);
}
.icon-btn:disabled {
  color: var(--icon-3);
}
.icon-btn.toggle[aria-pressed='true'] {
  background: var(--bg-brand-3);
  color: var(--icon-brand);
}

/* ---- Onglets ----------------------------------------------------------- */
.tabbar {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 12px 0 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tabs {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar {
  display: none;
}
.tabs.has-overflow {
  mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  padding: 0 8px;
  border-radius: var(--radius);
  color: var(--text-2);
  font-weight: 400;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background var(--d-fast) var(--ease-out), color var(--d-fast) var(--ease-out);
}
.tab:hover {
  color: var(--text);
}
.tab[aria-selected='true'] {
  background: var(--bg-2);
  color: var(--text);
  font-weight: 600;
}
.tab .count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: var(--radius);
  background: var(--bg-2);
  color: var(--text-2);
  font-weight: 400;
}
.tab[aria-selected='true'] .count {
  background: var(--bg-3);
  color: var(--text);
}
.tab-sep {
  width: 1px;
  height: 16px;
  background: var(--border);
  margin: 0 2px;
  flex-shrink: 0;
}
.tabs-right {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

/* ---- Corps ------------------------------------------------------------- */
.body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.tab-body {
  padding: 8px var(--pad) var(--pad);
  animation: fade-in var(--d-panel) var(--ease-out);
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.notice {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: var(--cell-h);
  margin: 0 0 var(--row-gap);
  padding: 4px 8px;
  border-radius: var(--radius);
  background: var(--bg-2);
  color: var(--text-2);
}
.notice .icon {
  color: var(--icon-2);
  width: 14px;
  height: 14px;
}
.notice b {
  color: var(--text);
  font-weight: 600;
}
.notice.warn {
  color: var(--text-warning);
}
.notice.warn .icon {
  color: var(--text-warning);
}
.notice-bar {
  margin: 8px var(--pad) 0;
}

/* En-tête de section : « Frame › Fill » */
.section-head {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  height: var(--cell-h);
  margin: 16px 0 var(--row-gap);
  padding: 0 6px 0 8px;
  border-radius: var(--radius);
  text-align: left;
  color: var(--text-strong);
  transition: background var(--d-fast) var(--ease-out);
}
.section-head:first-child {
  margin-top: 0;
}
.tab-body > .notice + .section-head {
  margin-top: 0;
}
.section-head:hover {
  background: var(--bg-hover);
}
.section-head[aria-pressed='true'] {
  background: var(--bg-selected);
}
.section-head .kind-icon {
  width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--icon);
  margin: 0 2px 0 -4px;
}
.section-head .kind-icon .icon {
  width: 10px;
  height: 10px;
  stroke-width: 1.4;
}
.sec-sep {
  display: inline-flex;
  color: var(--icon-3);
}
.sec-sep .icon {
  width: 6px;
  height: 8px;
  stroke-width: 1.5;
}
.sec-kind,
.sec-prop {
  font-weight: 400;
}
.sec-count {
  margin-left: auto;
  color: var(--text-3);
}

/* Ligne : [valeur actuelle] → [suggestion] */
.row {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 32px minmax(0, 1fr);
  align-items: center;
  margin-bottom: var(--row-gap);
  border-radius: var(--radius);
}
.row.is-fixed,
.row.is-ignored {
  opacity: 0.5;
}
.row.is-pending {
  opacity: 0.6;
}
.row.just-fixed .cell {
  animation: fixed-flash var(--d-fix) var(--ease-out);
}
@keyframes fixed-flash {
  from {
    background: var(--bg-brand-3);
  }
}
.cell {
  display: flex;
  align-items: center;
  gap: 6px;
  height: var(--cell-h);
  min-width: 0;
  padding: 0 6px;
  border-radius: var(--radius);
  text-align: left;
  border: 1px solid transparent;
  transition: border-color var(--d-fast) var(--ease-out);
}
.cell.cur {
  background: var(--bg-2);
  color: var(--text-2);
}
.cell.sug {
  background: var(--bg);
  border-color: var(--border);
  color: var(--text-strong);
  padding-right: 5px;
}
.row[aria-selected='true'] .cell {
  border-color: var(--border-brand);
}
.cell.sug.has-menu {
  cursor: default;
}
.cell.sug.has-menu:hover:not(:disabled),
.cell.sug.is-open {
  border-color: var(--border-strong);
}
.row[aria-selected='true'] .cell.sug.has-menu:hover:not(:disabled) {
  border-color: var(--border-brand);
}
.cell.sug:disabled {
  color: var(--text-2);
}
.cell.sug.is-empty {
  color: var(--text-2);
}
.cell .val,
.cell .name {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row.is-fixed .cell.cur .val {
  text-decoration: line-through;
}
.cell-icon {
  display: inline-flex;
  color: var(--icon);
  flex-shrink: 0;
}
.cell-icon .icon {
  width: 14px;
  height: 14px;
}
.cell .name .var-glyph {
  display: inline-block;
  width: 9px;
  height: 9px;
  vertical-align: -1px;
  margin-right: 0;
  fill: currentColor;
  stroke: none;
}
.chev {
  display: inline-flex;
  color: var(--icon);
  flex-shrink: 0;
}
.chev .icon {
  width: 16px;
  height: 16px;
}
.cnt {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text-2);
  flex-shrink: 0;
}
.gap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: var(--cell-h);
}
.arrow {
  display: inline-flex;
  color: var(--icon-3);
  transition: opacity var(--d-fast) var(--ease-out);
}
.arrow .icon {
  width: 16px;
  height: 16px;
  stroke-width: 1.4;
}
.row-info {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--icon-2);
  opacity: 0;
  transition: opacity var(--d-fast) var(--ease-out), background var(--d-fast) var(--ease-out);
}
.row-info .icon {
  width: 14px;
  height: 14px;
}
.row:hover .arrow,
.row:focus-within .arrow,
.row.is-expanded .arrow {
  opacity: 0;
}
.row:hover .row-info,
.row:focus-within .row-info,
.row.is-expanded .row-info {
  opacity: 1;
}
.row-info:hover,
.row-info[aria-expanded='true'] {
  background: var(--bg-hover);
  color: var(--icon);
}
.swatch {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-xs);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background-color: #fff;
  background-image: linear-gradient(45deg, #d9d9d9 25%, transparent 25%, transparent 75%, #d9d9d9 75%),
    linear-gradient(45deg, #d9d9d9 25%, transparent 25%, transparent 75%, #d9d9d9 75%);
  background-size: 7px 7px;
  background-position:
    0 0,
    3.5px 3.5px;
}
.swatch > i {
  position: absolute;
  inset: 0;
}
.badge {
  display: inline-flex;
  align-items: center;
  height: 14px;
  padding: 0 4px;
  border-radius: 7px;
  font-weight: 400;
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 12px;
  box-shadow: inset 0 0 0 1px var(--border);
  color: var(--text-2);
}
.badge-match {
  color: var(--text-success);
  box-shadow: inset 0 0 0 1px var(--border-success);
}
.badge-close {
  color: var(--text-component);
  box-shadow: inset 0 0 0 1px var(--border-component);
}
.badge-chosen {
  color: var(--text-brand);
  box-shadow: inset 0 0 0 1px var(--bg-brand-3);
  background: var(--bg-brand-3);
}
.badge-fixed {
  color: var(--text-success);
  box-shadow: inset 0 0 0 1px var(--border-success);
}
.badge-muted {
  color: var(--text-2);
}
.badge.mono {
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 9px;
}

/* Menu déroulant des suggestions alternatives, aligné sur la cellule */
.dropdown {
  position: absolute;
  z-index: 15;
  right: 0;
  top: calc(100% + 2px);
  width: calc(50% - 16px);
  background: var(--bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow-2);
  padding: 4px;
  display: flex;
  flex-direction: column;
  animation: pop-in var(--d-fast) var(--ease-out);
}
@keyframes pop-in {
  from {
    opacity: 0;
    transform: translateY(-2px);
  }
}
.dd-item {
  display: flex;
  align-items: center;
  gap: 6px;
  height: var(--cell-h);
  padding: 0 6px;
  border-radius: 4px;
  text-align: left;
  color: var(--text-strong);
}
.dd-item:hover {
  background: var(--bg-hover);
}
.dd-item[aria-selected='true'] {
  background: var(--bg-selected);
}

token de bordure ou r\xE9utiliser un token existant.",noTokens:"Cr\xE9er une collection de variables de couleur, puis relancer l\u2019analyse."}},"typography/no-text-style":{title:"Texte sans style",message:{exact:"\xAB {value} \xBB n\u2019utilise aucun Text Style. \xAB {suggestion} \xBB correspond exactement.",close:"\xAB {value} \xBB n\u2019utilise aucun Text Style. \xAB {suggestion} \xBB partage la m\xEAme famille et la m\xEAme taille.",none:"\xAB {value} \xBB n\u2019utilise aucun Text Style et aucun style ne correspond.",noStyles:"\xAB {value} \xBB n\u2019utilise aucun Text Style. Ce fichier n\u2019a pas encore de styles de texte."},why:"Sans style, chaque texte est une exception : impossible de faire \xE9voluer la typographie globalement, et le handoff perd le nom du style.",suggestion:{default:"Appliquer le Text Style correspondant.",none:"Choisir un style existant ou cr\xE9er un style si cette combinaison est l\xE9gitime.",noStyles:"Cr\xE9er les Text Styles de l\u2019\xE9chelle typographique, puis relancer l\u2019analyse."}},"typography/mixed-styles":{title:"Styles m\xE9lang\xE9s dans un texte",message:"Ce bloc contient {segments} styles typographiques diff\xE9rents.",why:"Des styles m\xE9lang\xE9s dans un m\xEAme calque sont difficiles \xE0 impl\xE9menter proprement et fragiles \xE0 maintenir.",suggestion:"S\xE9parer les textes ou n\u2019utiliser qu\u2019un style par calque."},"typography/off-scale-size":{title:"Taille hors \xE9chelle",message:"{value} ne fait pas partie de l\u2019\xE9chelle du fichier ({scale}). Valeur la plus proche : {nearest} px.",why:"Une taille isol\xE9e casse le rythme typographique et multiplie les exceptions c\xF4t\xE9 code.",suggestion:"Utiliser une taille de l\u2019\xE9chelle ou appliquer un Text Style."},"spacing/off-scale-padding":{title:"Padding hors \xE9chelle",message:{exact:"Padding {fields} = {value}, non li\xE9. \xAB {suggestion} \xBB correspond exactement.",close:"Padding {fields} = {value}, non li\xE9. \xAB {suggestion} \xBB est la valeur la plus proche.",ambiguous:"Padding {fields} = {value}, non li\xE9. Deux tokens sont \xE0 distance \xE9gale : choisis.",grid:"Padding {fields} = {value} : pas un multiple de la grille de {grid} px.",none:"Padding {fields} = {value}, non li\xE9 et sans token d\u2019espacement correspondant."},why:"Les espacements hors \xE9chelle cr\xE9ent des rythmes \xAB presque \xBB identiques (16 vs 18) qui paraissent incoh\xE9rents et compliquent l\u2019impl\xE9mentation.",suggestion:{default:"Lier \xE0 un token d\u2019espacement.",grid:"Arrondir \xE0 un multiple de {grid} px.",none:"Choisir une valeur de l\u2019\xE9chelle ou cr\xE9er un token."}},"spacing/off-scale-gap":{title:"Gap hors \xE9chelle",message:{exact:"Gap = {value}, non li\xE9. \xAB {suggestion} \xBB correspond exactement.",close:"Gap = {value}, non li\xE9. \xAB {suggestion} \xBB est la valeur la plus proche.",ambiguous:"Gap = {value}, non li\xE9. Deux tokens sont \xE0 distance \xE9gale : choisis.",grid:"Gap = {value} : pas un multiple de la grille de {grid} px.",none:"Gap = {value}, non li\xE9 et sans token d\u2019espacement correspondant."},why:"Le gap d\xE9finit le rythme d\u2019une liste ou d\u2019une grille : une valeur isol\xE9e se voit imm\xE9diatement.",suggestion:{default:"Lier \xE0 un token d\u2019espacement.",grid:"Arrondir \xE0 un multiple de {grid} px.",none:"Choisir une valeur de l\u2019\xE9chelle ou cr\xE9er un token."}},"radius/not-tokenized":{title:"Rayon non tokenis\xE9",message:{exact:"Rayon {fields} = {value}, non li\xE9. \xAB {suggestion} \xBB correspond exactement.",close:"Rayon {fields} = {value}, non li\xE9. \xAB {suggestion} \xBB est proche.",ambiguous:"Rayon {fields} = {value}, non li\xE9. Plusieurs tokens sont proches.",none:"Rayon {fields} = {value}, non li\xE9 et sans token de radius correspondant."},why:"Les rayons sont une signature visuelle : un rayon isol\xE9 casse la coh\xE9rence des composants.",suggestion:{default:"Lier au token de radius.",none:"Utiliser une valeur de l\u2019\xE9chelle de radius."}},"components/detached-instance":{title:"Instance d\xE9tach\xE9e",message:"\xAB {node} \xBB a \xE9t\xE9 d\xE9tach\xE9 d\u2019un composant ({origin}).",why:"Un calque d\xE9tach\xE9 ne re\xE7oit plus les mises \xE0 jour du composant et d\xE9rive silencieusement.",suggestion:"Reprendre une instance du composant, ou documenter l\u2019exception si elle est volontaire."},"components/default-name":{title:"Nom de calque par d\xE9faut",message:"\xAB {node} \xBB garde son nom par d\xE9faut.",why:"Les noms par d\xE9faut (Frame 47, Group 3) n\u2019aident ni la navigation, ni le handoff, ni les exports.",suggestion:"Nommer le calque selon son r\xF4le : \xAB Card / Header \xBB, \xAB Price badge \xBB."},"components/heavy-overrides":{title:"Instance tr\xE8s modifi\xE9e",message:"{count} propri\xE9t\xE9s de style surcharg\xE9es sur cette instance ({fields}).",why:"Beaucoup d\u2019overrides signalent un composant qui ne couvre pas ce besoin : il manque une variante, ou l\u2019instance devrait \xEAtre un autre composant.",suggestion:"Ajouter une variante ou une propri\xE9t\xE9 au composant, puis r\xE9initialiser les overrides."},"components/duplicate-component":{title:"Composants en doublon",message:"\xAB {node} \xBB existe en {count} exemplaires : {others}.",why:"Deux composants quasi identiques se d\xE9synchronisent et doublent le travail de maintenance.",suggestion:"Fusionner en un seul composant avec des variantes."},"components/no-description":{title:"Composant sans description",message:"\xAB {node} \xBB n\u2019a pas de description.",why:"La description explique l\u2019usage, les props et les limites : c\u2019est la documentation minimale pour l\u2019\xE9quipe et les devs.",suggestion:"Ajouter une description courte : usage, variantes, lien vers la doc."},"craft/missing-state":{title:"\xC9tat interactif manquant",message:"\xAB {component} \xBB n\u2019a pas d\u2019\xE9tat {state} (propri\xE9t\xE9 {prop}).",why:{focus:"Un utilisateur clavier ne pourra pas voir o\xF9 se trouve le focus.",hover:"L\u2019utilisateur ne saura pas que l\u2019\xE9l\xE9ment est interactif avant de cliquer.",pressed:"Aucun retour visuel ne confirme que l\u2019action est en cours.",disabled:"Impossible de montrer qu\u2019une action est temporairement indisponible.",error:"L\u2019utilisateur ne saura pas qu\u2019une saisie est invalide, ni pourquoi.",selected:"L\u2019\xE9tat s\xE9lectionn\xE9 ou coch\xE9 n\u2019est pas diff\xE9renci\xE9 : l\u2019utilisateur ne sait pas ce qu\u2019il a choisi.",default:"Un \xE9tat manquant devra \xEAtre invent\xE9 par les d\xE9veloppeurs, souvent sans coh\xE9rence."},suggestion:"Ajouter une variante {prop}={state} au composant."},"craft/missing-loading-state":{title:"\xC9tat de chargement manquant",message:"\xAB {component} \xBB d\xE9clenche une action longue mais n\u2019a pas d\u2019\xE9tat loading.",why:"Apr\xE8s le clic, l\u2019utilisateur ne saura pas si l\u2019action est en cours et risquera de cliquer deux fois.",suggestion:"Ajouter une variante {prop}=Loading avec spinner et label conserv\xE9."},"craft/missing-empty-state":{title:"\xC9tat vide manquant",message:"\xAB {component} \xBB n\u2019a pas d\u2019\xE9tat vide.",why:"Sans \xE9tat vide, l\u2019utilisateur face \xE0 une liste sans r\xE9sultat n\u2019a aucune orientation.",suggestion:"Ajouter un \xE9tat Empty avec message et action (ex. \xAB R\xE9initialiser les filtres \xBB)."},"craft/state-naming":{title:"Nomenclature d\u2019\xE9tats incoh\xE9rente",message:"\xAB {component} \xBB utilise une orthographe minoritaire : {changes}.",why:"Des variantes nomm\xE9es diff\xE9remment (Hover, hover, :hover) compliquent le swap d\u2019instances et le mapping avec le code.",suggestion:"Harmoniser les noms de propri\xE9t\xE9s et de valeurs sur l\u2019ensemble des composants."},"craft/missing-hover-transition":{title:"Transition hover manquante",message:"\xAB {component} \xBB a un \xE9tat hover mais aucune interaction Default \u2192 Hover.",why:"Les autres composants du fichier sont interactifs : celui-ci para\xEEtra fig\xE9 dans le prototype.",suggestion:"Ajouter une interaction \xAB While hovering \u2192 Change to Hover \xBB."},"craft/inconsistent-motion":{title:"Dur\xE9e de transition incoh\xE9rente",message:"Hover en {duration} ms sur \xAB {component} \xBB ; les autres {kind} utilisent {mode} ms.",why:"M\xEAme action = m\xEAme dur\xE9e : une transition diff\xE9rente para\xEEt cass\xE9e ou lente.",suggestion:"Harmoniser \xE0 {mode} ms."},"a11y/text-contrast":{title:"Contraste insuffisant",message:"Contraste {ratio} entre {fg} et {bg} ; minimum requis : {required} pour {size} px.",why:"Sous le seuil WCAG AA, une partie des utilisateurs ne peut pas lire ce texte, notamment en plein soleil ou avec une basse vision.",suggestion:{default:"Assombrir ou \xE9claircir le texte ou le fond. Token conforme le plus proche : \xAB {suggestion} \xBB.",none:"Assombrir ou \xE9claircir le texte ou le fond jusqu\u2019\xE0 atteindre {required}."}},"a11y/contrast-not-verifiable":{title:"Contraste non v\xE9rifiable",message:{image:"Le texte repose sur une image : le contraste n\u2019est pas calculable automatiquement.",gradient:"Le texte repose sur un d\xE9grad\xE9 : le contraste n\u2019est pas calculable automatiquement.",opacity:"Un parent semi-transparent emp\xEAche de conna\xEEtre le fond r\xE9el.",mixed:"Ce texte m\xE9lange plusieurs couleurs.",default:"Le fond r\xE9el ne peut pas \xEAtre d\xE9termin\xE9."},why:"Le plugin n\u2019invente pas de r\xE9sultat : v\xE9rifie ce texte manuellement.",suggestion:"Ajouter un voile ou un fond uni derri\xE8re le texte, puis relancer l\u2019analyse."},"a11y/touch-target":{title:"Zone tactile trop petite",message:"{width} \xD7 {height} px : la cible interactive fait moins de {min} px.",why:"Les cibles trop petites provoquent des erreurs de clic, surtout sur mobile et pour les personnes avec des troubles moteurs (WCAG 2.5.8).",suggestion:"Agrandir la zone cliquable \xE0 au moins {min} \xD7 {min} px, m\xEAme si l\u2019ic\xF4ne reste petite."},"a11y/text-too-small":{title:"Texte trop petit",message:"{value} : en dessous du minimum recommand\xE9 de {min} px.",why:"Les petits textes sont les premiers illisibles sur mobile et pour les personnes avec une basse vision.",suggestion:"Monter \xE0 {min} px minimum, ou r\xE9server cette taille aux mentions secondaires."},"handoff/fractional-size":{title:"Dimension non arrondie",message:"{value} : des fractions de pixel qui n\u2019existent pas en CSS.",why:"Les valeurs d\xE9cimales produisent du flou, des arrondis incoh\xE9rents et des specs illisibles.",suggestion:"Arrondir \xE0 l\u2019entier le plus proche."},"handoff/fractional-position":{title:"Position non arrondie",message:"{value} : le calque n\u2019est pas sur la grille de pixels.",why:"Un calque \xE0 mi-pixel se rend flou et d\xE9cale les mesures dans le mode Dev.",suggestion:"Arrondir la position \xE0 l\u2019entier le plus proche."},"handoff/stackable-without-autolayout":{title:"Pile sans auto layout",message:"{count} enfants align\xE9s en {direction} sans auto layout.",why:"Un empilement manuel ne s\u2019adapte ni au contenu ni aux largeurs : les devs devront deviner le flex.",suggestion:"Activer l\u2019auto layout (\u21E7 A) et v\xE9rifier le gap."},"tokens/broken-alias":{title:"Alias cass\xE9",message:"\xAB {name} \xBB pointe vers une variable introuvable (mode {mode}).",why:"Un alias cass\xE9 rend la valeur impr\xE9visible : Figma garde la derni\xE8re valeur connue, le code n\u2019aura rien.",suggestion:"R\xE9tablir l\u2019alias vers le token voulu, ou remplacer par une valeur explicite."},"tokens/circular-alias":{title:"Alias circulaire",message:"{chain} : la cha\xEEne d\u2019alias revient sur elle-m\xEAme.",why:"Une boucle n\u2019a pas de valeur finale ; chaque consommateur peut la r\xE9soudre diff\xE9remment.",suggestion:"Faire pointer le dernier maillon vers un token primitif."},"tokens/orphan":{title:"Token jamais utilis\xE9",message:"\xAB {name} \xBB n\u2019est li\xE9 \xE0 aucun calque du fichier et aucun autre token ne l\u2019alias.",why:"Un token mort encombre les pickers et finit par diverger du syst\xE8me.",suggestion:"Supprimer le token, ou l\u2019utiliser l\xE0 o\xF9 sa valeur est cod\xE9e en dur."},"tokens/duplicate-value":{title:"Tokens de m\xEAme valeur",message:"\xAB {name} \xBB a exactement la m\xEAme valeur que {others}.",why:"Deux noms pour une valeur : on choisit au hasard, et une mise \xE0 jour ne touche que la moiti\xE9 des usages.",suggestion:"Faire de l\u2019un un alias de l\u2019autre, ou les fusionner si leurs r\xF4les sont identiques."},"tokens/primitive-bound":{title:"Token primitif utilis\xE9 directement",message:{exact:"{token} est un token de palette ; \xAB {semantic} \xBB porte la m\xEAme valeur avec un r\xF4le explicite.",none:"{token} est un token de palette appliqu\xE9 directement \xE0 un calque."},why:"Les primitifs d\xE9crivent une valeur, pas un usage : si la marque change, les calques li\xE9s \xE0 blue/500 ne suivent pas le bon r\xF4le.",suggestion:"Lier au token s\xE9mantique correspondant (action, texte, surface, bordure)."},"tokens/mode-gap":{title:"Mode non couvert",message:"\xAB {name} \xBB a la m\xEAme valeur dans tous les modes ({modes}) alors que \xAB {collection} \xBB varie par mode.",why:"Un token identique en clair et en sombre est souvent un oubli : il rendra un \xE9l\xE9ment illisible dans l\u2019un des modes.",suggestion:"D\xE9finir une valeur par mode, ou documenter que le token est volontairement constant."},"tokens/unscoped":{title:"Token sans scope",message:"\xAB {name} \xBB est utilisable partout alors que la plupart des couleurs du fichier sont scop\xE9es.",why:"Les scopes emp\xEAchent d\u2019appliquer une couleur de texte comme fond : sans scope, le picker propose tout \xE0 tout le monde.",suggestion:"Restreindre le scope du token \xE0 ses usages r\xE9els."},"typography/near-duplicate-styles":{title:"Styles de texte quasi identiques",message:"\xAB {a} \xBB et \xAB {b} \xBB : m\xEAme police ({font}), {sizeA} et {sizeB} px.",why:"Deux styles presque \xE9gaux brouillent la hi\xE9rarchie et doublent la maintenance.",suggestion:"Fusionner les deux styles ou accentuer leur diff\xE9rence (taille, graisse, r\xF4le)."},"typography/line-length":{title:"Ligne trop longue",message:"Environ {chars} caract\xE8res par ligne sur {width} px (recommand\xE9 : {max} au plus).",why:"Au-del\xE0 de 70 \xE0 80 caract\xE8res, l\u2019\u0153il perd la ligne suivante : la lecture ralentit.",suggestion:"R\xE9duire la largeur du bloc, augmenter la taille, ou passer en colonnes."},"typography/line-height-inconsistent":{title:"Interligne incoh\xE9rent",message:"{family} {size} px avec un interligne de {lineHeight} px ; {count} autres textes utilisent {mode} px.",why:"M\xEAme taille, m\xEAme rythme vertical : un interligne diff\xE9rent d\xE9cale les alignements d\u2019une carte \xE0 l\u2019autre.",suggestion:"Harmoniser \xE0 {mode} px, id\xE9alement via un style de texte."},"typography/label-case":{title:"Casse de libell\xE9 incoh\xE9rente",message:"\xAB {text} \xBB ne suit pas la casse majoritaire des libell\xE9s ({share} %).",why:"La casse fait partie de la voix du produit : la m\xE9langer donne une impression de hasard.",suggestion:"\xC9crire \xAB {suggested} \xBB."},"spacing/rhythm-near-miss":{title:"Rythme presque identique",message:"Gap de {gap} px sur \xAB {role} \xBB ; les {count} conteneurs \xE9quivalents utilisent surtout {mode} px.",why:"16 et 18 px dans des contextes \xE9quivalents ne se voient pas isol\xE9ment, mais cassent l\u2019alignement global.",suggestion:"Harmoniser le gap \xE0 {mode} px."},"spacing/fixed-should-fill":{title:"Dimension fixe \xE0 passer en Fill",message:{width:"Largeur fixe de {size} px, \xE9gale \xE0 l\u2019espace disponible dans \xAB {parent} \xBB.",height:"Hauteur fixe de {size} px, \xE9gale \xE0 l\u2019espace disponible dans \xAB {parent} \xBB."},why:"Une dimension fixe qui co\xEFncide avec le parent ne suivra pas un redimensionnement : le d\xE9veloppeur devra deviner un flex: 1.",suggestion:"Passer le redimensionnement en Fill container."},"spacing/fixed-should-hug":{title:"Dimension fixe \xE0 passer en Hug",message:{width:"Largeur fixe de {size} px, exactement \xE9gale au contenu.",height:"Hauteur fixe de {size} px, exactement \xE9gale au contenu."},why:"Un conteneur fixe qui colle \xE0 son contenu se cassera au premier texte plus long.",suggestion:"Passer l\u2019axe en Hug contents."},"spacing/text-overlap":{title:"Textes qui se chevauchent",message:"Chevauche \xAB {other} \xBB sur {dx} \xD7 {dy} px.",why:"Deux textes superpos\xE9s sont presque toujours un accident : illisible \xE0 l\u2019\xE9cran, ambigu pour le d\xE9veloppeur.",suggestion:"D\xE9placer l\u2019un des textes ou passer le parent en auto layout."},"components/reattach-instance":{title:"Instance d\xE9tach\xE9e \xE0 rattacher",message:{exact:"\xAB {value} \xBB est d\xE9tach\xE9 ; une instance de \xAB {component} \xBB reproduit son contenu \xE0 l\u2019identique.",close:"\xAB {value} \xBB est d\xE9tach\xE9 ; une instance de \xAB {component} \xBB le reproduit avec {total} overrides report\xE9s automatiquement (textes : {texts}, visibilit\xE9 : {visibility}, couleurs : {paints}).","inside-instance":"\xAB {value} \xBB est d\xE9tach\xE9 \xE0 l\u2019int\xE9rieur d\u2019une instance : impossible d\u2019y ins\xE9rer une instance.","component-missing":"\xAB {value} \xBB est d\xE9tach\xE9 et son composant d\u2019origine est introuvable (supprim\xE9, ou librairie inaccessible).",structure:"\xAB {value} \xBB a diverg\xE9 de son composant : calques ajout\xE9s ou non reproductibles ({detail}). Rattachement manuel.",forced:"\xAB {value} \xBB a diverg\xE9 de son composant ({detail}). Rattachable en conservant le rendu : instance de \xAB {component} \xBB avec {total} overrides, et {extras} calque(s) ajout\xE9(s) gard\xE9(s) au-dessus dans un cadre \xAB {value} \xBB."},why:"Un calque d\xE9tach\xE9 ne re\xE7oit plus les mises \xE0 jour du composant et d\xE9rive du syst\xE8me. Le rattacher ne vaut que si l\u2019instance reproduit exactement ce qui est \xE0 l\u2019\xE9cran.",suggestion:{default:"Remplacer par une instance : textes, calques masqu\xE9s, couleurs et taille sont report\xE9s ; Cmd/Ctrl+Z restaure l\u2019original \xE0 l\u2019identique.",forced:"V\xE9rifie le rendu dans Comparer, puis \xAB Inclure quand m\xEAme \xBB ici, ou inclus toutes les divergentes depuis le pied de page. La correction ne se fait qu\u2019avec \xAB Appliquer \xBB ; la structure devient alors un cadre contenant l\u2019instance et les calques ajout\xE9s.",structure:"Retirer les calques ajout\xE9s ou cr\xE9er une variante correspondante dans le composant, puis relancer l\u2019analyse.","inside-instance":"Rattacher d\u2019abord le parent, ou corriger dans le composant principal.","component-missing":"Recr\xE9er le composant ou activer la librairie, puis relancer l\u2019analyse."}},"components/deprecated-in-use":{title:"Composant obsol\xE8te utilis\xE9",message:"Instance de \xAB {component} \xBB, marqu\xE9 comme obsol\xE8te.",why:"Un composant d\xE9pr\xE9ci\xE9 ne re\xE7oit plus de corrections : l\u2019\xE9cran divergera du syst\xE8me.",suggestion:"Remplacer l\u2019instance par le composant qui le remplace."},"components/orphan-variant":{title:"Variante jamais utilis\xE9e",message:"\xAB {variant} \xBB de \xAB {component} \xBB n\u2019a aucune instance dans le fichier.",why:"Une variante sans usage est soit un oubli d\u2019int\xE9gration, soit du poids mort \xE0 maintenir.",suggestion:"Utiliser la variante l\xE0 o\xF9 elle est attendue, ou la retirer du jeu."},"components/useless-nesting":{title:"Conteneur sans r\xF4le",message:{group:"Groupe contenant un seul calque : \xAB {child} \xBB.",frame:"Frame sans fond, bordure ni layout, contenant un seul calque : \xAB {child} \xBB."},why:"Chaque niveau inutile alourdit le calque, le handoff et la navigation.",suggestion:"D\xE9grouper ou supprimer le conteneur."},"components/no-doc-link":{title:"Composant sans lien de documentation",message:"\xAB {component} \xBB n\u2019a pas de lien de documentation alors que d\u2019autres composants en ont.",why:"Le lien de doc est ce que voient les d\xE9veloppeurs dans Dev Mode : sans lui, ils devinent les r\xE8gles d\u2019usage.",suggestion:"Ajouter un lien de documentation dans les propri\xE9t\xE9s du composant."},"components/no-status":{title:"Composant sans statut",message:"\xAB {component} \xBB n\u2019indique pas de statut alors que le fichier en utilise (ex. \xAB {example} \xBB).",why:"Sans statut, impossible de savoir si un composant est pr\xEAt, en revue ou \xE0 \xE9viter.",suggestion:"Ajouter le statut dans le nom ou la description, comme les autres composants."},"a11y/heading-skip":{title:"Niveau de titre saut\xE9",message:"Passage de H{prev} \xE0 H{level} ; H{expected} \xE9tait attendu.",why:"Les lecteurs d\u2019\xE9cran s\u2019appuient sur la hi\xE9rarchie des titres pour naviguer : un saut d\xE9soriente.",suggestion:"Utiliser le style de titre de niveau H{expected}, ou revoir la structure."},"a11y/icon-contrast":{title:"Contraste d\u2019ic\xF4ne insuffisant",message:"Contraste {ratio} entre {fg} et {bg} ; minimum {required} pour un \xE9l\xE9ment graphique.",why:"WCAG 1.4.11 : une ic\xF4ne interactive doit rester distinguable de son fond.",suggestion:"Assombrir ou \xE9claircir l\u2019ic\xF4ne pour atteindre 3:1."},"a11y/border-contrast":{title:"Bordure de champ peu contrast\xE9e",message:"Contraste {ratio} entre la bordure {stroke} et le fond {bg} ; minimum {required}.",why:"La bordure est souvent le seul indice visuel d\u2019un champ : trop p\xE2le, le champ dispara\xEEt.",suggestion:"Renforcer la bordure pour atteindre 3:1."},"a11y/icon-only-without-label":{title:"Bouton ic\xF4ne sans libell\xE9",message:"\xAB {name} \xBB est interactif, sans texte, et son nom n\u2019indique pas son action.",why:"Le nom du calque devient le libell\xE9 accessible au handoff : \xAB Icon button \xBB ne 01C{suggestion}\u201D matches exactly.",close:"{value} is not bound to a variable. \u201C{suggestion}\u201D is very close.",ambiguous:"{value} is not bound to a variable. Several tokens are close: your call.",none:"{value} is not bound to a variable and no token matches.",noTokens:"{value} is hard-coded. This file has no color variables yet."},why:"An unbound color will not follow theme or brand changes, and developers will not know which token to use.",suggestion:{default:"Bind the color to the matching variable.",none:"Create a token if this color is legitimate, or replace it with an existing token.",noTokens:"Create a color variable collection, then run the check again."}},"colors/hardcoded-stroke":{title:"Hard-coded stroke color",message:{exact:"{value} is not bound to a variable. \u201C{suggestion}\u201D matches exactly.",close:"{value} is not bound to a variable. \u201C{suggestion}\u201D is very close.",ambiguous:"{value} is not bound to a variable. Several tokens are close: your call.",none:"{value} is not bound to a variable and no token matches.",noTokens:"{value} is hard-coded. This file has no color variables yet."},why:"Hard-coded strokes drift over time: slightly different borders per component make the UI look unpolished.",suggestion:{default:"Bind the stroke to the matching variable.",none:"Create a border token or reuse an existing one.",noTokens:"Create a color variable collection, then run the check again."}},"typography/no-text-style":{title:"Text without style",message:{exact:"\u201C{value}\u201D uses no Text Style. \u201C{suggestion}\u201D matches exactly.",close:"\u201C{value}\u201D uses no Text Style. \u201C{suggestion}\u201D shares the same family and size.",none:"\u201C{value}\u201D uses no Text Style and no style matches.",noStyles:"\u201C{value}\u201D uses no Text Style. This file has no text styles yet."},why:"Without a style every text is an exception: typography cannot evolve globally, and the handoff loses the style name.",suggestion:{default:"Apply the matching Text Style.",none:"Pick an existing style, or create one if this combination is legitimate.",noStyles:"Create the Text Styles of your type scale, then run the check again."}},"typography/mixed-styles":{title:"Mixed styles in one text",message:"This block contains {segments} different type styles.",why:"Mixed styles inside a single layer are hard to implement cleanly and fragile to maintain.",suggestion:"Split the texts or use one style per layer."},"typography/off-scale-size":{title:"Off-scale font size",message:"{value} is not part of the file\u2019s type scale ({scale}). Nearest value: {nearest} px.",why:"An isolated size breaks the typographic rhythm and multiplies exceptions in code.",suggestion:"Use a size from the scale or apply a Text Style."},"spacing/off-scale-padding":{title:"Off-scale padding",message:{exact:"Padding {fields} = {value}, unbound. \u201C{suggestion}\u201D matches exactly.",close:"Padding {fields} = {value}, unbound. \u201C{suggestion}\u201D is the closest value.",ambiguous:"Padding {fields} = {value}, unbound. Two tokens are equally close: your call.",grid:"Padding {fields} = {value}: not a multiple of the {grid} px grid.",none:"Padding {fields} = {value}, unbound and no spacing token matches."},why:"Off-scale spacing creates \u201Calmost identical\u201D rhythms (16 vs 18) that look inconsistent and complicate implementation.",suggestion:{default:"Bind to a spacing token.",grid:"Round to a multiple of {grid} px.",none:"Pick a value from the scale or create a token."}},"spacing/off-scale-gap":{title:"Off-scale gap",message:{exact:"Gap = {value}, unbound. \u201C{suggestion}\u201D matches exactly.",close:"Gap = {value}, unbound. \u201C{suggestion}\u201D is the closest value.",ambiguous:"Gap = {value}, unbound. Two tokens are equally close: your call.",grid:"Gap = {value}: not a multiple of the {grid} px grid.",none:"Gap = {value}, unbound and no spacing token matches."},why:"The gap sets the rhythm of a list or grid: an isolated value is immediately visible.",suggestion:{default:"Bind to a spacing token.",grid:"Round to a multiple of {grid} px.",none:"Pick a value from the scale or create a token."}},"radius/not-tokenized":{title:"Untokenized radius",message:{exact:"Radius {fields} = {value}, unbound. \u201C{suggestion}\u201D matches exactly.",close:"Radius {fields} = {value}, unbound. \u201C{suggestion}\u201D is close.",ambiguous:"Radius {fields} = {value}, unbound. Several tokens are close.",none:"Radius {fields} = {value}, unbound and no radius token matches."},why:"Radii are a visual signature: an isolated radius breaks component consistency.",suggestion:{default:"Bind to the radius token.",none:"Use a value from the radius scale."}},"components/detached-instance":{title:"Detached instance",message:"\u201C{node}\u201D was detached from a component ({origin}).",why:"A detached layer no longer receives component updates and drifts silently.",suggestion:"Use an instance of the component again, or document the exception if intentional."},"components/default-name":{title:"Default layer name",message:"\u201C{node}\u201D still has its default name.",why:"Default names (Frame 47, Group 3) help neither navigation, handoff nor exports.",suggestion:"Name the layer after its role: \u201CCard / Header\u201D, \u201CPrice badge\u201D."},"components/heavy-overrides":{title:"Heavily overridden instance",message:"{count} style properties are overridden on this instance ({fields}).",why:"Many overrides mean the component does not cover this need: a variant is missing, or this should be another component.",suggestion:"Add a variant or property to the component, then reset the overrides."},"components/duplicate-component":{title:"Duplicate components",message:"\u201C{node}\u201D exists {count} times: {others}.",why:"Two near-identical components drift apart and double the maintenance work.",suggestion:"Merge into a single component with variants."},"components/no-description":{title:"Component without description",message:"\u201C{node}\u201D has no description.",why:"The description explains usage, props and limits: the minimal documentation for the team and developers.",suggestion:"Add a short description: usage, variants, link to docs."},"craft/missing-state":{title:"Missing interactive state",message:"\u201C{component}\u201D has no {state} state (property {prop}).",why:{focus:"Keyboard users will not see where the focus is.",hover:"Users will not know the element is interactive before clicking.",pressed:"No visual feedback confirms the action is happening.",disabled:"There is no way to show an action is temporarily unavailable.",error:"Users will not know an input is invalid, nor why.",selected:"The selected or checked state is not differentiated: users cannot tell what they chose.",default:"A missing state will be invented by developers, often inconsistently."},suggestion:"Add a {prop}={state} variant to the component."},"craft/missing-loading-state":{title:"Missing loading state",message:"\u201C{component}\u201D triggers a long action but has no loading state.",why:"After the click, users will not know whether the action is running and may click twice.",suggestion:"Add a {prop}=Loading variant with a spinner and the label kept."},"craft/missing-empty-state":{title:"Missing empty state",message:"\u201C{component}\u201D has no empty state.",why:"Without an empty state, a user facing an empty list has no guidance.",suggestion:"Add an Empty state with a message and an action (e.g. \u201CReset filters\u201D)."},"craft/state-naming":{title:"Inconsistent state naming",message:"\u201C{component}\u201D uses a minority spelling: {changes}.",why:"Differently named variants (Hover, hover, :hover) complicate instance swapping and code mapping.",suggestion:"Harmonize property and value names across components."},"craft/missing-hover-transition":{title:"Missing hover transition",message:"\u201C{component}\u201D has a hover state but no Default \u2192 Hover interaction.",why:"Other components in this file are interactive: this one will feel frozen in the prototype.",suggestion:"Add a \u201CWhile hovering \u2192 Change to Hover\u201D interaction."},"craft/inconsistent-motion":{title:"Inconsistent transition duration",message:"Hover takes {duration} ms on \u201C{component}\u201D; other {kind} use {mode} ms.",why:"Same action, same duration: a different transition feels broken or slow.",suggestion:"Harmonize to {mode} ms."},"a11y/text-contrast":{title:"Insufficient contrast",message:"Contrast {ratio} between {fg} and {bg}; required minimum: {required} at {size} px.",why:"Below WCAG AA, part of your users cannot read this text, especially in sunlight or with low vision.",suggestion:{default:"Darken or lighten the text or background. Closest compliant token: \u201C{suggestion}\u201D.",none:"Darken or lighten the text or background until you reach {required}."}},"a11y/contrast-not-verifiable":{title:"Contrast not verifiable",message:{image:"The text sits on an image: contrast cannot be computed automatically.",gradient:"The text sits on a gradient: contrast cannot be computed automatically.",opacity:"A semi-transparent parent hides the real background.",mixed:"This text mixes several colors.",default:"The real background cannot be determined."},why:"The plugin never invents a result: check this text manually.",suggestion:"Add a scrim or a solid background behind the text, then run again."},"a11y/touch-target":{title:"Touch target too small",message:"{width} \xD7 {height} px: the interactive target is under {min} px.",why:"Small targets cause mis-taps, especially on mobile and for people with motor impairments (WCAG 2.5.8).",suggestion:"Grow the clickable area to at least {min} \xD7 {min} px, even if the icon stays small."},"a11y/text-too-small":{title:"Text too small",message:"{value}: below the recommended minimum of {min} px.",why:"Small text is the first to become unreadable on mobile and for people with low vision.",suggestion:"Raise to at least {min} px, or keep this size for secondary notes only."},"handoff/fractional-size":{title:"Fractional size",message:"{value}: sub-pixel values that do not exist in CSS.",why:"Decimal values produce blur, inconsistent rounding and unreadable specs.",suggestion:"Round to the nearest integer."},"handoff/fractional-position":{title:"Fractional position",message:"{value}: the layer is off the pixel grid.",why:"A half-pixel layer renders blurry and shifts measurements in Dev Mode.",suggestion:"Round the position to the nearest integer."},"handoff/stackable-without-autolayout":{title:"Stack without auto layout",message:"{count} children aligned as a {direction} without auto layout.",why:"A manual stack adapts neither to content nor to widths: developers will have to guess the flex.",suggestion:"Enable auto layout (\u21E7 A) and check the gap."},"tokens/broken-alias":{title:"Broken alias",message:"\u201C{name}\u201D points to a variable that no longer exists (mode {mode}).",why:"A broken alias makes the value unpredictable: Figma keeps the last known value, code gets nothing.",suggestion:"Restore the alias to the intended token, or replace it with an explicit value."},"tokens/circular-alias":{title:"Circular alias",message:"{chain}: the alias chain loops back on itself.",why:"A loop has no final value; every consumer may resolve it differently.",suggestion:"Point the last link to a primitive token."},"tokens/orphan":{title:"Token never used",message:"\u201C{name}\u201D is bound to no layer in the file and no other token aliases it.",why:"A dead token clutters pickers and ends up drifting from the system.",suggestion:"Delete the token, or use it where its value is hard-coded."},"tokens/duplicate-value":{title:"Tokens with the same value",message:"\u201C{name}\u201D has exactly the same value as {others}.",why:"Two names for one value: people pick at random, and an update only reaches half the usages.",suggestion:"Make one an alias of the other, or merge them if their roles are identical."},"tokens/primitive-bound":{title:"Primitive token used directly",message:{exact:"{token} is a palette token; \u201C{semantic}\u201D carries the same value with an explicit role.",none:"{token} is a palette token applied directly to a layer."},why:"Primitives describe a value, not a usage: when the brand changes, layers bound to blue/500 do not follow the right role.",suggestion:"Bind to the matching semantic token (action, text, surface, border)."},"tokens/mode-gap":{title:"Mode not covered",message:"\u201C{name}\u201D has the same value in every mode ({modes}) while \u201C{collection}\u201D varies by mode.",why:"A token identical in light and dark is usually an oversight: it will make something unreadable in one mode.",suggestion:"Define a value per mode, or document that the token is intentionally constant."},"tokens/unscoped":{title:"Token without scope",message:"\u201C{name}\u201D can be used anywhere while most colors in the file are scoped.",why:"Scopes prevent applying a text color as a background: without them, the picker offers everything to everyone.",suggestion:"Restrict the token scope to its real usages."},"typography/near-duplicate-styles":{title:"Near-identical text styles",message:"\u201C{a}\u201D and \u201C{b}\u201D: same font ({font}), {sizeA} and {sizeB} px.",why:"Two almost equal styles blur the hierarchy and double the maintenance.",suggestion:"Merge both styles or make their difference meaningful (size, weight, role)."},"typography/line-length":{title:"Line too long",message:"About {chars} characters per line over {width} px (recommended: at most {max}).",why:"Beyond 70 to 80 characters the eye loses the next line: reading slows down.",suggestion:"Narrow the block, raise the size, or use columns."},"typography/line-height-inconsistent":{title:"Inconsistent line height",message:"{family} {size} px with a {lineHeight} px line height; {count} other texts use {mode} px.",why:"Same size, same vertical rhythm: a different line height shifts alignments from one card to the next.",suggestion:"Harmonize to {mode} px, ideally through a text style."},"typography/label-case":{title:"Inconsistent label case",message:"\u201C{text}\u201D does not follow the majority label case ({share}%).",why:"Case is part of the product voice: mixing it feels random.",suggestion:"Write \u201C{suggested}\u201D."},"spacing/rhythm-near-miss":{title:"Almost identical rhythm",message:"{gap} px gap on \u201C{role}\u201D; the {count} equivalent containers mostly use {mode} px.",why:"16 and 18 px in equivalent contexts go unnoticed alone but break the global alignment.",suggestion:"Harmonize the gap to {mode} px."},"spacing/fixed-should-fill":{title:"Fixed size that should be Fill",message:{width:"Fixed width of {size} px, equal to the space available in \u201C{parent}\u201D.",height:"Fixed height of {size} px, equal to the space available in \u201C{parent}\u201D."},why:"A fixed dimension that matches the parent will not follow a resize: developers will have to guess a flex: 1.",suggestion:"Switch the resizing to Fill container."},"spacing/fixed-should-hug":{title:"Fixed size that should be Hug",message:{width:"Fixed width of {size} px, exactly equal to the content.",height:"Fixed height of {size} px, exactly equal to the content."},why:"A fixed container that hugs its content will break on the first longer text.",suggestion:"Switch the axis to Hug contents."},"spacing/text-overlap":{title:"Overlapping texts",message:"Overlaps \u201C{other}\u201D by {dx} \xD7 {dy} px.",why:"Two stacked texts are almost always an accident: unreadable on screen, ambiguous for the developer.",suggestion:"Move one of the texts or switch the parent to auto layout."},"components/reattach-instance":{title:"Detached instance to re-attach",message:{exact:"\u201C{value}\u201D is detached; an instance of \u201C{component}\u201D reproduces its content exactly.",close:"\u201C{value}\u201D is detached; an instance of \u201C{component}\u201D reproduces it with {total} overrides applied automatically (texts: {texts}, visibility: {visibility}, colors: {paints}).","inside-instance":"\u201C{value}\u201D is detached inside an instance: an instance cannot be inserted there.","component-missing":"\u201C{value}\u201D is detached and its original component cannot be found (deleted, or library unavailable).",structure:"\u201C{value}\u201D drifted from its component: layers added or not reproducible ({detail}). Manual re-attachment.",forced:"\u201C{value}\u201D drifted from its component ({detail}). Re-attachable while keeping the rendering: instance of \u201C{component}\u201D with {total} overrides, and {extras} added layer(s) kept above in a \u201C{value}\u201D frame."},why:"A detached layer no longer receives component updates and drifts from the system. Re-attaching is only worth it when the instance reproduces exactly what is on screen.",suggestion:{default:"Replace with an instance: texts, hidden layers, colors and size are carried over; Cmd/Ctrl+Z restores the original exactly.",forced:"Check the rendering in Compare, then \u201CInclude anyway\u201D here, or include every divergent row from the footer. Fixing only happens with \u201CApply\u201D; the structure then becomes a frame holding the instance and the added layers.",structure:"Remove the added layers or create a matching variant in the component, then run the check again.","inside-instance":"Re-attach the parent first, or fix it in the main component.","component-missing":"Recreate the component or enable the library, then run the check again."}},"components/deprecated-in-use":{title:"Deprecated component in use",message:"Instance of \u201C{component}\u201D, marked as deprecated.",why:"A deprecated component no longer receives fixes: the screen will drift from the system.",suggestion:"Replace the instance with its successor component."},"components/orphan-variant":{title:"Variant never used",message:"\u201C{variant}\u201D of \u201C{component}\u201D has no instance in the file.",why:"An unused variant is either a missed integration or dead weight to maintain.",suggestion:"Use the variant where it is expected, or remove it from the set."},"components/useless-nesting":{title:"Container without a role",message:{group:"Group holding a single layer: \u201C{child}\u201D.",frame:"Frame without fill, border or layout, holding a single layer: \u201C{child}\u201D."},why:"Every useless level weighs on the layer tree, the handoff and navigation.",suggestion:"Ungroup or remove the container."},"components/no-doc-link":{title:"Component without documentation link",message:"\u201C{component}\u201D has no documentation link while other components do.",why:"The doc link is what developers see in Dev Mode: without it they guess the usage rules.",suggestion:"Add a documentation link in the component properties."},"components/no-status":{title:"Component without status",message:"\u201C{component}\u201D shows no status while the file uses one (e.g. \u201C{example}\u201D).",why:"Without a status nobody knows whether a component is ready, in review or to avoid.",suggestion:"Add the status to the name or description, like the other components."},"a11y/heading-skip":{title:"Skipped heading level",message:"Jump from H{prev} to H{level}; H{expected} was expected.",why:"Screen readers rely on the heading hierarchy to navigate: a skip is disorienting.",suggestion:"Use the H{expected} heading style, or revisit the structure."},"a11y/icon-contrast":{title:"Insufficient icon contrast",message:"Contrast {ratio} between {fg} and {bg}; minimum {required} for a graphical element.",why:"WCAG 1.4.11: an interactive icon must stay distinguishable from its background.",suggestion:"Darken or lighten the icon to reach 3:1."},"a11y/border-contrast":{title:"Low-contrast field border",message:"Contrast {ratio} between the {stroke} border and the {bg} background; minimum {required}.",why:"The border is often the only visual cue of a field: too pale, the field disappears.",suggestion:"Strengthen the border to reach 3:1."},"a11y/icon-only-without-label":{title:"Icon button without label",message:"\u201C{name}\u201D is interactive, has no text, and its name does not say what it does.",why:"The layer name becomes the accessible label at handoff: \u201CIcon button\u201D means nothing to a screen reader.",suggestion:"Name the layer after its action (\u201CClose\u201D, \u201CSearch\u201D) and plan a tooltip or aria-label."},"a11y/color-only-status":{title:"Status conveyed by color alone",message:"Text bound to \u201C{token}\u201D without an icon or any cue other than color.",why:"About 8% of men struggle to tell red from green: color cannot be the only signal.",suggestion:"Add an icon, a prefix or a text treatment."},"handoff/repeated-pattern":{title:"Repeated pattern not componentized",message:"{count} identical \u201C{name}\u201D layers in \u201C{parent}\u201D.",why:"Repeating a structure by hand multiplies drifts and edits; developers will see a component to create.",suggestion:"Create a component and replace the repetitions with instances."},"handoff/image-crop":{title:"Hand-cropped image",message:"\u201C{name}\u201D uses a manual crop.",why:"Figma crop has no direct CSS equivalent: the image position will be reinterpreted.",suggestion:"Prefer Fill or Fit with a container ratio, or export the cropped image."},"craft/missing-success-state":{title:"Missing success state",message:"\u201C{component}\u201D triggers a long action without a success state.",why:"After a payment or a submission the user must see it is done, not only that loading stopped.",suggestion:"Add {prop}=Success, or define the feedback (toast, screen) in the flow."},"craft/destructive-without-confirm":{title:"Destructive action without a safety net",message:"\u201C{label}\u201D deletes or removes, and no confirmation dialog or undo exists in the scope.",why:"Deleting without confirmation or Undo is the first source of irreversible mistakes.",suggestion:"P
