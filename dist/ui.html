<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Senior Check Design</title>
    <style>
      /* ---------------------------------------------------------------------------
   Senior Check Design : UI calquée au pixel sur la modale « Check designs »
   Métriques relevées sur la capture officielle (2x) : header 40, barre
   d'onglets 40, onglets 24 (pastille 16, rayon 5), lignes 24 espacées de 8,
   cellules rayon 5 et padding 6, pastille couleur 14 rayon 2, flèche 9 px,
   badge 14 px, footer 40, bouton 24 avec compteur.
   Les couleurs utilisent les variables de thème Figma avec, en repli, les
   valeurs mesurées sur la capture.
   --------------------------------------------------------------------------- */
:root {
  --bg: var(--figma-color-bg, #ffffff);
  --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
  --bg-3: var(--figma-color-bg-tertiary, #e6e6e6);
  --bg-hover: var(--figma-color-bg-hover, rgba(0, 0, 0, 0.05));
  --bg-selected: var(--figma-color-bg-selected, #e5f4ff);
  --bg-brand: var(--figma-color-bg-brand, #0d99ff);
  --bg-brand-hover: var(--figma-color-bg-brand-hover, #007be5);
  --bg-brand-3: var(--figma-color-bg-brand-tertiary, #e5f4ff);
  --bg-danger: var(--figma-color-bg-danger, #f24822);
  --bg-warning: var(--figma-color-bg-warning, #ffcd29);
  --bg-success: var(--figma-color-bg-success, #14ae5c);
  --bg-inverse: var(--figma-color-bg-inverse, #2c2c2c);
  --bg-disabled: var(--figma-color-bg-disabled, #e6e6e6);
  --text: var(--figma-color-text, #1a1a1a);
  --text-strong: var(--figma-color-text, #000000);
  --text-2: var(--figma-color-text-secondary, #7f7f7f);
  --text-3: var(--figma-color-text-tertiary, #b3b3b3);
  --text-brand: var(--figma-color-text-brand, #007be5);
  --text-danger: var(--figma-color-text-danger, #dc3412);
  --text-warning: var(--figma-color-text-warning, #a8720b);
  --text-success: var(--figma-color-text-success, #009951);
  --text-component: var(--figma-color-text-component, #7b3ff2);
  --text-onbrand: var(--figma-color-text-onbrand, #ffffff);
  --text-oninverse: var(--figma-color-text-oninverse, #ffffff);
  --text-disabled: var(--figma-color-text-disabled, rgba(0, 0, 0, 0.3));
  --border: var(--figma-color-border, #e6e6e6);
  --border-strong: var(--figma-color-border-strong, #2c2c2c);
  --border-brand: var(--figma-color-border-brand, #0d99ff);
  --border-success: var(--figma-color-border-success, #b9ebc6);
  --border-component: var(--figma-color-border-component, #dcd0ff);
  --icon: var(--figma-color-icon, #1a1a1a);
  --icon-2: var(--figma-color-icon-secondary, #7f7f7f);
  --icon-3: var(--figma-color-icon-tertiary, #b2b2b2);
  --icon-brand: var(--figma-color-icon-brand, #007be5);

  --font: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --fs: 11px;
  --radius: 5px;
  --radius-xs: 2px;
  --cell-h: 24px;
  --row-gap: 8px;
  --pad: 16px;

  --d-fast: 100ms;
  --d-fix: 180ms;
  --d-panel: 160ms;
  --d-toast-in: 180ms;
  --d-toast-out: 140ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --shadow-1: 0 1px 3px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.06);
  --shadow-2: 0 6px 20px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.08);
  --focus-ring: 0 0 0 1px var(--bg), 0 0 0 3px var(--border-brand);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --d-fast: 0ms;
    --d-fix: 0ms;
    --d-panel: 0ms;
    --d-toast-in: 0ms;
    --d-toast-out: 0ms;
  }
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}
body {
  font: 400 var(--fs) / 16px var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: default;
  border: 0;
  background: none;
  padding: 0;
}
:focus {
  outline: none;
}
:focus-visible {
  box-shadow: var(--focus-ring);
}
.num {
  font-variant-numeric: tabular-nums;
}
.muted {
  color: var(--text-2);
}
.grow {
  flex: 1;
  min-width: 0;
}
.icon {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.25;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.ellipsis {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---- Structure ---------------------------------------------------------- */
#app {
  height: 100%;
  display: flex;
  flex-direction: row;
  position: relative;
}
/* Colonne principale (liste) ; le volet Comparer se place à sa droite. */
.main {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}
#app.is-collapsed .header {
  border-bottom: 0;
}
body.is-resizing,
body.is-resizing * {
  cursor: inherit !important;
  user-select: none;
}
.header {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 40px;
  padding: 0 8px 0 var(--pad);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.title-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.title {
  margin: 0;
  font-size: var(--fs);
  font-weight: 600;
  line-height: 16px;
  white-space: nowrap;
  color: var(--text);
}
.score {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 16px;
  padding: 0 5px 0 4px;
  border-radius: var(--radius);
  background: var(--bg-2);
  color: var(--text);
}
.score::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--bg-success);
}
.score[data-level='mid']::before {
  background: var(--bg-warning);
}
.score[data-level='low']::before {
  background: var(--bg-danger);
}
.icon-btn {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--icon);
  transition: background var(--d-fast) var(--ease-out), color var(--d-fast) var(--ease-out);
}
.icon-btn:hover:not(:disabled) {
  background: var(--bg-hover);
}
.icon-btn:disabled {
  color: var(--icon-3);
}
.icon-btn.toggle[aria-pressed='true'] {
  background: var(--bg-brand-3);
  color: var(--icon-brand);
}

/* ---- Onglets ----------------------------------------------------------- */
.tabbar {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 12px 0 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tabs {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar {
  display: none;
}
.tabs.has-overflow {
  mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  padding: 0 8px;
  border-radius: var(--radius);
  color: var(--text-2);
  font-weight: 400;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background var(--d-fast) var(--ease-out), color var(--d-fast) var(--ease-out);
}
.tab:hover {
  color: var(--text);
}
.tab[aria-selected='true'] {
  background: var(--bg-2);
  color: var(--text);
  font-weight: 600;
}
.tab .count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: var(--radius);
  background: var(--bg-2);
  color: var(--text-2);
  font-weight: 400;
}
.tab[aria-selected='true'] .count {
  background: var(--bg-3);
  color: var(--text);
}
.tab-sep {
  width: 1px;
  height: 16px;
  background: var(--border);
  margin: 0 2px;
  flex-shrink: 0;
}
.tabs-right {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

/* ---- Corps ------------------------------------------------------------- */
.body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.tab-body {
  padding: 8px var(--pad) var(--pad);
  animation: fade-in var(--d-panel) var(--ease-out);
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.notice {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: var(--cell-h);
  margin: 0 0 var(--row-gap);
  padding: 4px 8px;
  border-radius: var(--radius);
  background: var(--bg-2);
  color: var(--text-2);
}
.notice .icon {
  color: var(--icon-2);
  width: 14px;
  height: 14px;
}
.notice b {
  color: var(--text);
  font-weight: 600;
}
.notice.warn {
  color: var(--text-warning);
}
.notice.warn .icon {
  color: var(--text-warning);
}
.notice-bar {
  margin: 8px var(--pad) 0;
}

/* En-tête de section : « Frame › Fill » */
.section-head {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  height: var(--cell-h);
  margin: 16px 0 var(--row-gap);
  padding: 0 6px 0 8px;
  border-radius: var(--radius);
  text-align: left;
  color: var(--text-strong);
  transition: background var(--d-fast) var(--ease-out);
}
.section-head:first-child {
  margin-top: 0;
}
.tab-body > .notice + .section-head {
  margin-top: 0;
}
.section-head:hover {
  background: var(--bg-hover);
}
.section-head[aria-pressed='true'] {
  background: var(--bg-selected);
}
.section-head .kind-icon {
  width: 16px;
  height: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--icon);
  margin: 0 2px 0 -4px;
}
.section-head .kind-icon .icon {
  width: 10px;
  height: 10px;
  stroke-width: 1.4;
}
.sec-sep {
  display: inline-flex;
  color: var(--icon-3);
}
.sec-sep .icon {
  width: 6px;
  height: 8px;
  stroke-width: 1.5;
}
.sec-kind,
.sec-prop {
  font-weight: 400;
}
.sec-count {
  margin-left: auto;
  color: var(--text-3);
}

/* Ligne : [valeur actuelle] → [suggestion] */
.row {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 32px minmax(0, 1fr);
  align-items: center;
  margin-bottom: var(--row-gap);
  border-radius: var(--radius);
}
.row.is-fixed,
.row.is-ignored {
  opacity: 0.5;
}
.row.is-pending {
  opacity: 0.6;
}
.row.just-fixed .cell {
  animation: fixed-flash var(--d-fix) var(--ease-out);
}
@keyframes fixed-flash {
  from {
    background: var(--bg-brand-3);
  }
}
.cell {
  display: flex;
  align-items: center;
  gap: 6px;
  height: var(--cell-h);
  min-width: 0;
  padding: 0 6px;
  border-radius: var(--radius);
  text-align: left;
  border: 1px solid transparent;
  transition: border-color var(--d-fast) var(--ease-out);
}
.cell.cur {
  background: var(--bg-2);
  color: var(--text-2);
}
.cell.sug {
  background: var(--bg);
  border-color: var(--border);
  color: var(--text-strong);
  padding-right: 5px;
}
.row[aria-selected='true'] .cell {
  border-color: var(--border-brand);
}
.cell.sug.has-menu {
  cursor: default;
}
.cell.sug.has-menu:hover:not(:disabled),
.cell.sug.is-open {
  border-color: var(--border-strong);
}
.row[aria-selected='true'] .cell.sug.has-menu:hover:not(:disabled) {
  border-color: var(--border-brand);
}
.cell.sug:disabled {
  color: var(--text-2);
}
.cell.sug.is-empty {
  color: var(--text-2);
}
.cell .val,
.cell .name {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row.is-fixed .cell.cur .val {
  text-decoration: line-through;
}
.cell-icon {
  display: inline-flex;
  color: var(--icon);
  flex-shrink: 0;
}
.cell-icon .icon {
  width: 14px;
  height: 14px;
}
.cell .name .var-glyph {
  display: inline-block;
  width: 9px;
  height: 9px;
  vertical-align: -1px;
  margin-right: 0;
  fill: currentColor;
  stroke: none;
}
.chev {
  display: inline-flex;
  color: var(--icon);
  flex-shrink: 0;
}
.chev .icon {
  width: 16px;
  height: 16px;
}
.cnt {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text-2);
  flex-shrink: 0;
}
.gap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: var(--cell-h);
}
.arrow {
  display: inline-flex;
  color: var(--icon-3);
  transition: opacity var(--d-fast) var(--ease-out);
}
.arrow .icon {
  width: 16px;
  height: 16px;
  stroke-width: 1.4;
}
.row-info {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--icon-2);
  opacity: 0;
  transition: opacity var(--d-fast) var(--ease-out), background var(--d-fast) var(--ease-out);
}
.row-info .icon {
  width: 14px;
  height: 14px;
}
.row:hover .arrow,
.row:focus-within .arrow,
.row.is-expanded .arrow {
  opacity: 0;
}
.row:hover .row-info,
.row:focus-within .row-info,
.row.is-expanded .row-info {
  opacity: 1;
}
.row-info:hover,
.row-info[aria-expanded='true'] {
  background: var(--bg-hover);
  color: var(--icon);
}
.swatch {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-xs);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background-color: #fff;
  background-image: linear-gradient(45deg, #d9d9d9 25%, transparent 25%, transparent 75%, #d9d9d9 75%),
    linear-gradient(45deg, #d9d9d9 25%, transparent 25%, transparent 75%, #d9d9d9 75%);
  background-size: 7px 7px;
  background-position:
    0 0,
    3.5px 3.5px;
}
.swatch > i {
  position: absolute;
  inset: 0;
}
.badge {
  display: inline-flex;
  align-items: center;
  height: 14px;
  padding: 0 4px;
  border-radius: 7px;
  font-weight: 400;
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 12px;
  box-shadow: inset 0 0 0 1px var(--border);
  color: var(--text-2);
}
.badge-match {
  color: var(--text-success);
  box-shadow: inset 0 0 0 1px var(--border-success);
}
.badge-close {
  color: var(--text-component);
  box-shadow: inset 0 0 0 1px var(--border-component);
}
.badge-chosen {
  color: var(--text-brand);
  box-shadow: inset 0 0 0 1px var(--bg-brand-3);
  background: var(--bg-brand-3);
}
.badge-fixed {
  color: var(--text-success);
  box-shadow: inset 0 0 0 1px var(--border-success);
}
.badge-muted {
  color: var(--text-2);
}
.badge.mono {
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 9px;
}

/* Menu déroulant des suggestions alternatives, aligné sur la cellule */
.dropdown {
  position: absolute;
  z-index: 15;
  right: 0;
  top: calc(100% + 2px);
  width: calc(50% - 16px);
  background: var(--bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow-2);
  padding: 4px;
  display: flex;
  flex-direction: column;
  animation: pop-in var(--d-fast) var(--ease-out);
}
@keyframes pop-in {
  from {
    opacity: 0;
    transform: translateY(-2px);
  }
}
.dd-item {
  display: flex;
  align-items: center;
  gap: 6px;
  height: var(--cell-h);
  padding: 0 6px;
  border-radius: 4px;
  text-align: left;
  color: var(--text-strong);
}
.dd-item:hover {
  background: var(--bg-hover);
}
.dd-item[aria-selected='true'] {
  background: var(--bg-selected);
}
.dd-label {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dd-sub {
  color: var(--text-2);
}
.dd-item .icon {
  width: 12px;
  height: 12px;
  color: var(--icon);
}

/* Détail inline d'une ligne */
.row-detail {
  margin: -2px 0 var(--row-gap);
  padding: 10px 12px;
  border-radius: var(--radius);
  background: var(--bg-2);
  display: flex;
  flex-direction: column;
  gap: 8px;
  animation: fade-in var(--d-panel) var(--ease-out);
}
.detail-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}
.detail-msg {
  margin: 0;
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.k {
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 2px;
}
.v {
  color: var(--text);
}
.layer-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
}
.layer-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 6px;
  border-radius: var(--radius);
  background: var(--bg);
  box-shadow: inset 0 0 0 1px var(--border);
  max-width: 100%;
}
.layer-chip:hover {
  background: var(--bg-hover);
}
.layer-chip .icon {
  width: 10px;
  height: 10px;
}
.layer-chip span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.detail-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-brand);
  margin-top: 4px;
  height: 24px;
  padding: 0 6px;
  border-radius: 4px;
}
.link-btn:hover {
  background: var(--bg-hover);
}
.link-btn .icon {
  width: 14px;
  height: 14px;
}

/* ---- États ------------------------------------------------------------- */
.scanning {
  padding: 8px var(--pad) var(--pad);
  display: flex;
  flex-direction: column;
  gap: var(--row-gap);
}
.scan-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  height: var(--cell-h);
}
.scan-title {
  font-weight: 600;
}
.scan-phase {
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar {
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--bg-brand);
  border-radius: 2px;
  transition: width 120ms linear;
}
.bar.indeterminate > i {
  width: 40%;
  animation: slide 1.1s var(--ease-out) infinite;
}
@keyframes slide {
  from {
    transform: translateX(-120%);
  }
  to {
    transform: translateX(300%);
  }
}
.skeleton {
  display: flex;
  flex-direction: column;
  gap: var(--row-gap);
  margin-top: 8px;
}
.sk-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 32px minmax(0, 1fr);
  align-items: center;
}
.sk-cell {
  height: var(--cell-h);
  border-radius: var(--radius);
  background: linear-gradient(90deg, var(--bg-2) 25%, var(--bg-3) 50%, var(--bg-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
}
.sk-arrow {
  height: 1px;
  background: var(--bg-3);
  margin: 0 11px;
}
@keyframes shimmer {
  to {
    background-position: -200% 0;
  }
}
.state-box {
  padding: 40px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.state-box .big-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--bg-2);
  color: var(--text-success);
  margin-bottom: 6px;
}
.state-box h2 {
  margin: 0;
  font-size: var(--fs);
  font-weight: 600;
}
.state-box p {
  margin: 0;
  color: var(--text-2);
  max-width: 320px;
}

/* ---- Footer ------------------------------------------------------------ */
.footer {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 40px;
  padding: 0 8px 0 var(--pad);
  border-top: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}
.foot-text {
  flex: 1;
  min-width: 0;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.foot-bar {
  flex: 1;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: var(--cell-h);
  padding: 0 8px;
  border-radius: var(--radius);
  font-weight: 500;
  border: 1px solid transparent;
  white-space: nowrap;
  transition: background var(--d-fast) var(--ease-out), border-color var(--d-fast) var(--ease-out);
}
.btn .icon {
  width: 14px;
  height: 14px;
}
.btn-primary {
  background: var(--bg-brand);
  color: var(--text-onbrand);
  padding: 0 8px 0 10px;
}
.btn-primary:hover:not(:disabled) {
  background: var(--bg-brand-hover);
}
.btn-primary:disabled {
  background: var(--bg-disabled);
  color: var(--text-disabled);
}
.count-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 14px;
  padding: 0 5px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.2);
  font-weight: 500;
}
.btn-primary:disabled .count-pill {
  background: rgba(0, 0, 0, 0.06);
}
.btn-secondary {
  border-color: var(--border);
  background: var(--bg);
  color: var(--text);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--bg-hover);
}
.btn-sm {
  height: 20px;
  padding: 0 6px;
  border-radius: 4px;
}

/* ---- Popovers, dialogues, formulaires --------------------------------- */
.scrim {
  position: absolute;
  inset: 0;
  z-index: 20;
}
.scrim.dim {
  background: rgba(0, 0, 0, 0.3);
  display: grid;
  place-items: center;
  padding: 16px;
  animation: fade-in var(--d-fast) var(--ease-out);
}
.popover {
  position: absolute;
  background: var(--bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow-2);
  animation: pop-in var(--d-panel) var(--ease-out);
}
.popover.menu {
  right: 36px;
  top: 36px;
  padding: 4px;
  min-width: 180px;
  display: flex;
  flex-direction: column;
}
.popover.menu button {
  display: flex;
  align-items: center;
  gap: 8px;
  height: var(--cell-h);
  padding: 0 8px;
  border-radius: 4px;
  text-align: left;
}
.popover.menu button:hover {
  background: var(--bg-hover);
}
.popover.menu .icon {
  width: 14px;
  height: 14px;
}
.popover.settings {
  right: 8px;
  top: 76px;
  width: 288px;
  max-height: calc(100% - 128px);
  overflow-y: auto;
  padding: 4px 12px 8px;
  display: flex;
  flex-direction: column;
}
.pop-section {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.pop-section:last-child,
.pop-section.about {
  border-bottom: 0;
}
.pop-section .k {
  margin-bottom: 6px;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.hint {
  color: var(--text-2);
  line-height: 15px;
}
.about .hint + .hint {
  margin-top: 4px;
  color: var(--text-3);
}
.segmented {
  display: flex;
  background: var(--bg-2);
  border-radius: var(--radius);
  padding: 2px;
  gap: 2px;
}
.segmented button {
  flex: 1;
  height: 20px;
  border-radius: 4px;
  color: var(--text-2);
  padding: 0 6px;
  white-space: nowrap;
  transition: background var(--d-fast) var(--ease-out), color var(--d-fast) var(--ease-out);
}
.segmented button:hover {
  color: var(--text);
}
.segmented button[aria-pressed='true'] {
  background: var(--bg);
  color: var(--text);
  box-shadow: var(--shadow-1);
}
.select {
  position: relative;
}
.select select {
  appearance: none;
  width: 100%;
  height: var(--cell-h);
  padding: 0 24px 0 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.select::after {
  content: '';
  position: absolute;
  right: 9px;
  top: 8px;
  width: 5px;
  height: 5px;
  border-right: 1.25px solid var(--icon);
  border-bottom: 1.25px solid var(--icon);
  transform: rotate(45deg);
  pointer-events: none;
}
.check {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: var(--cell-h);
}
.check input {
  appearance: none;
  width: 14px;
  height: 14px;
  margin: 0;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  background: var(--bg);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: background var(--d-fast) var(--ease-out);
}
.check input:checked {
  background: var(--bg-brand);
  border-color: var(--bg-brand);
}
.check input:checked::after {
  content: '';
  width: 4px;
  height: 7px;
  border: solid #fff;
  border-width: 0 1.5px 1.5px 0;
  transform: translateY(-1px) rotate(45deg);
}
.check input:focus-visible {
  box-shadow: var(--focus-ring);
}
.field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: var(--cell-h);
}
.field .segmented {
  width: 104px;
}
.field input[type='number'] {
  width: 56px;
  height: 22px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  text-align: right;
}
details.accordion {
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
}
details.accordion summary {
  list-style: none;
  cursor: default;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
  font-weight: 600;
  height: var(--cell-h);
}
details.accordion summary::-webkit-details-marker {
  display: none;
}
details.accordion summary::before {
  content: '';
  width: 5px;
  height: 5px;
  border-right: 1.25px solid currentColor;
  border-bottom: 1.25px solid currentColor;
  transform: rotate(-45deg);
  transition: transform var(--d-fast) var(--ease-out);
  margin: 0 2px;
}
details.accordion[open] summary::before {
  transform: rotate(45deg);
}
details.accordion .body {
  padding: 2px 0 6px;
}
.rule-list {
  display: flex;
  flex-direction: column;
  max-height: 200px;
  overflow: auto;
}
.dialog {
  background: var(--bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow-2);
  padding: 16px;
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.dialog h2 {
  margin: 0;
  font-size: var(--fs);
  font-weight: 600;
}
.dialog p {
  margin: 0;
  color: var(--text-2);
}
.row-end {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 4px;
}

/* ---- Toasts ------------------------------------------------------------ */
.toasts {
  position: absolute;
  left: var(--pad);
  right: var(--pad);
  bottom: 48px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 30;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 4px 0 12px;
  border-radius: var(--radius);
  background: var(--bg-inverse);
  color: var(--text-oninverse);
  box-shadow: var(--shadow-2);
  animation: toast-in var(--d-toast-in) var(--ease-out);
}
.toast.is-error {
  background: var(--bg-danger);
  color: #fff;
}
.toast.leaving {
  animation: toast-out var(--d-toast-out) var(--ease-in) forwards;
}
@keyframes toast-in {
  from {
    transform: translateY(8px);
    opacity: 0;
  }
}
@keyframes toast-out {
  to {
    transform: translateY(6px);
    opacity: 0;
  }
}
.toast .msg {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toast-action {
  height: 24px;
  padding: 0 8px;
  border-radius: 4px;
  color: #8fd1ff;
  font-weight: 500;
}
.toast-action:hover {
  background: rgba(255, 255, 255, 0.1);
}
.icon-btn.on-dark {
  color: inherit;
}
.icon-btn.on-dark:hover {
  background: rgba(255, 255, 255, 0.12);
}
.toast .progress {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  width: 100%;
  background: rgba(255, 255, 255, 0.35);
  transform-origin: left;
}
.toast:hover .progress {
  animation-play-state: paused;
}
@keyframes shrink {
  to {
    transform: scaleX(0);
  }
}

/* ---- Poignées de redimensionnement (bord droit, bord bas, coin) --------- */
.resize-edge {
  position: absolute;
  z-index: 40;
}
.resize-edge.r {
  top: 0;
  right: 0;
  bottom: 14px;
  width: 5px;
  cursor: ew-resize;
}
.resize-edge.b {
  left: 0;
  right: 14px;
  bottom: 0;
  height: 5px;
  cursor: ns-resize;
}
.resize-handle {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 14px;
  height: 14px;
  cursor: nwse-resize;
  z-index: 40;
  opacity: 0.5;
}
.resize-handle::before {
  content: '';
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: 5px;
  height: 5px;
  border-right: 1.25px solid var(--icon-2);
  border-bottom: 1.25px solid var(--icon-2);
}
.resize-handle:hover {
  opacity: 1;
}

/* ---- Lien inline (pied de page) --------------------------------------- */
.link-btn.inline {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 6px;
  margin: 0;
  border-radius: 4px;
  color: var(--text-brand);
  white-space: nowrap;
  flex-shrink: 0;
}
.link-btn.inline:hover {
  background: var(--bg-hover);
}
.hint.mt {
  margin-top: 6px;
}

/* ---- Volet Comparer ---------------------------------------------------- */
.compare {
  width: var(--cmp-w, 440px);
  flex: 0 0 auto;
  height: 100%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--bg);
  animation: fade-in var(--d-panel) var(--ease-out);
}
.cmp-head {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 8px 0 var(--pad);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.cmp-title {
  font-weight: 600;
  white-space: nowrap;
}
.cmp-head .segmented {
  flex: 1;
  min-width: 0;
  max-width: 300px;
  margin-left: auto;
}
.cmp-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 8px 0 var(--pad);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  color: var(--text-2);
}
.cmp-frame {
  max-width: 50%;
}
.cmp-frame select {
  height: 24px;
}
.cmp-frame-name {
  color: var(--text);
  max-width: 50%;
}
.cmp-opacity {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.cmp-opacity input[type='range'] {
  width: 96px;
  height: 16px;
  margin: 0;
  accent-color: var(--bg-brand);
}
.cmp-zoom {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.cmp-zoom-val {
  min-width: 44px;
  height: 20px;
  padding: 0 4px;
  border-radius: 4px;
  color: var(--text);
  text-align: center;
}
.cmp-zoom-val:hover {
  background: var(--bg-hover);
}
.icon-btn.sm {
  width: 20px;
  height: 20px;
}
.cmp-stage {
  position: relative;
  flex: 1;
  min-height: 0;
  background: var(--bg-2);
  overflow: hidden;
}
.cmp-canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}
.cmp-canvas.is-panning {
  cursor: grabbing;
}
.cmp-canvas:focus-visible {
  box-shadow: inset 0 0 0 2px var(--border-brand);
}
.cmp-loading {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  overflow: hidden;
  opacity: 0;
  transition: opacity var(--d-fast) var(--ease-out);
}
.cmp-stage.is-loading .cmp-loading {
  opacity: 1;
}
.cmp-loading i {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 40%;
  background: var(--bg-brand);
  animation: cmp-slide 1.1s var(--ease-out) infinite;
}
@keyframes cmp-slide {
  from {
    left: -40%;
  }
  to {
    left: 100%;
  }
}
.cmp-stage.is-loading .cmp-canvas {
  opacity: 0.7;
  transition: opacity var(--d-panel) var(--ease-out);
}
.cmp-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 24px;
  text-align: center;
  color: var(--text-2);
  pointer-events: none;
}
.cmp-empty .icon {
  width: 18px;
  height: 18px;
  color: var(--icon-3);
  margin-bottom: 4px;
}
.cmp-empty p {
  margin: 0;
  max-width: 260px;
  line-height: 16px;
  color: var(--text);
}
.cmp-empty p.muted {
  color: var(--text-2);
}
.cmp-error {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 12px;
  margin: 0;
}
.cmp-foot {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 32px;
  padding: 0 var(--pad);
  border-top: 1px solid var(--border);
  color: var(--text-2);
  flex-shrink: 0;
}
.cmp-foot-diff {
  white-space: nowrap;
  color: var(--text);
}

/* ---- Pro : commutateur de mode, score Craft, menus ---------------------- */
.segmented.mode-switch {
  flex: 0 0 auto;
  margin-right: 4px;
}
.segmented.mode-switch button {
  padding: 0 8px;
}
.score.craft::before {
  background: var(--text-component);
}
.score.craft[data-level='mid']::before {
  background: var(--bg-warning);
}
.score.craft[data-level='low']::before {
  background: var(--bg-danger);
}
.menu-sep {
  height: 1px;
  margin: 4px 0;
  background: var(--border);
}
.row-btns {
  display: flex;
  gap: 6px;
}
.cmp-vision select {
  height: 24px;
  max-width: 132px;
}

ondir \xE0 un multiple de {grid} px.",none:"Choisir une valeur de l\u2019\xE9chelle ou cr\xE9er un token."}},"radius/not-tokenized":{title:"Rayon non tokenis\xE9",message:{exact:"Rayon {fields} = {value}, non li\xE9. \xAB {suggestion} \xBB correspond exactement.",close:"Rayon {fields} = {value}, non li\xE9. \xAB {suggestion} \xBB est proche.",ambiguous:"Rayon {fields} = {value}, non li\xE9. Plusieurs tokens sont proches.",none:"Rayon {fields} = {value}, non li\xE9 et sans token de radius correspondant."},why:"Les rayons sont une signature visuelle : un rayon isol\xE9 casse la coh\xE9rence des composants.",suggestion:{default:"Lier au token de radius.",none:"Utiliser une valeur de l\u2019\xE9chelle de radius."}},"components/detached-instance":{title:"Instance d\xE9tach\xE9e",message:"\xAB {node} \xBB a \xE9t\xE9 d\xE9tach\xE9 d\u2019un composant ({origin}).",why:"Un calque d\xE9tach\xE9 ne re\xE7oit plus les mises \xE0 jour du composant et d\xE9rive silencieusement.",suggestion:"Reprendre une instance du composant, ou documenter l\u2019exception si elle est volontaire."},"components/default-name":{title:"Nom de calque par d\xE9faut",message:"\xAB {node} \xBB garde son nom par d\xE9faut.",why:"Les noms par d\xE9faut (Frame 47, Group 3) n\u2019aident ni la navigation, ni le handoff, ni les exports.",suggestion:"Nommer le calque selon son r\xF4le : \xAB Card / Header \xBB, \xAB Price badge \xBB."},"components/heavy-overrides":{title:"Instance tr\xE8s modifi\xE9e",message:"{count} propri\xE9t\xE9s de style surcharg\xE9es sur cette instance ({fields}).",why:"Beaucoup d\u2019overrides signalent un composant qui ne couvre pas ce besoin : il manque une variante, ou l\u2019instance devrait \xEAtre un autre composant.",suggestion:"Ajouter une variante ou une propri\xE9t\xE9 au composant, puis r\xE9initialiser les overrides."},"components/duplicate-component":{title:"Composants en doublon",message:"\xAB {node} \xBB existe en {count} exemplaires : {others}.",why:"Deux composants quasi identiques se d\xE9synchronisent et doublent le travail de maintenance.",suggestion:"Fusionner en un seul composant avec des variantes."},"components/no-description":{title:"Composant sans description",message:"\xAB {node} \xBB n\u2019a pas de description.",why:"La description explique l\u2019usage, les props et les limites : c\u2019est la documentation minimale pour l\u2019\xE9quipe et les devs.",suggestion:"Ajouter une description courte : usage, variantes, lien vers la doc."},"craft/missing-state":{title:"\xC9tat interactif manquant",message:"\xAB {component} \xBB n\u2019a pas d\u2019\xE9tat {state} (propri\xE9t\xE9 {prop}).",why:{focus:"Un utilisateur clavier ne pourra pas voir o\xF9 se trouve le focus.",hover:"L\u2019utilisateur ne saura pas que l\u2019\xE9l\xE9ment est interactif avant de cliquer.",pressed:"Aucun retour visuel ne confirme que l\u2019action est en cours.",disabled:"Impossible de montrer qu\u2019une action est temporairement indisponible.",error:"L\u2019utilisateur ne saura pas qu\u2019une saisie est invalide, ni pourquoi.",selected:"L\u2019\xE9tat s\xE9lectionn\xE9 ou coch\xE9 n\u2019est pas diff\xE9renci\xE9 : l\u2019utilisateur ne sait pas ce qu\u2019il a choisi.",default:"Un \xE9tat manquant devra \xEAtre invent\xE9 par les d\xE9veloppeurs, souvent sans coh\xE9rence."},suggestion:"Ajouter une variante {prop}={state} au composant."},"craft/missing-loading-state":{title:"\xC9tat de chargement manquant",message:"\xAB {component} \xBB d\xE9clenche une action longue mais n\u2019a pas d\u2019\xE9tat loading.",why:"Apr\xE8s le clic, l\u2019utilisateur ne saura pas si l\u2019action est en cours et risquera de cliquer deux fois.",suggestion:"Ajouter une variante {prop}=Loading avec spinner et label conserv\xE9."},"craft/missing-empty-state":{title:"\xC9tat vide manquant",message:"\xAB {component} \xBB n\u2019a pas d\u2019\xE9tat vide.",why:"Sans \xE9tat vide, l\u2019utilisateur face \xE0 une liste sans r\xE9sultat n\u2019a aucune orientation.",suggestion:"Ajouter un \xE9tat Empty avec message et action (ex. \xAB R\xE9initialiser les filtres \xBB)."},"craft/state-naming":{title:"Nomenclature d\u2019\xE9tats incoh\xE9rente",message:"\xAB {component} \xBB utilise une orthographe minoritaire : {changes}.",why:"Des variantes nomm\xE9es diff\xE9remment (Hover, hover, :hover) compliquent le swap d\u2019instances et le mapping avec le code.",suggestion:"Harmoniser les noms de propri\xE9t\xE9s et de valeurs sur l\u2019ensemble des composants."},"craft/missing-hover-transition":{title:"Transition hover manquante",message:"\xAB {component} \xBB a un \xE9tat hover mais aucune interaction Default \u2192 Hover.",why:"Les autres composants du fichier sont interactifs : celui-ci para\xEEtra fig\xE9 dans le prototype.",suggestion:"Ajouter une interaction \xAB While hovering \u2192 Change to Hover \xBB."},"craft/inconsistent-motion":{title:"Dur\xE9e de transition incoh\xE9rente",message:"Hover en {duration} ms sur \xAB {component} \xBB ; les autres {kind} utilisent {mode} ms.",why:"M\xEAme action = m\xEAme dur\xE9e : une transition diff\xE9rente para\xEEt cass\xE9e ou lente.",suggestion:"Harmoniser \xE0 {mode} ms."},"a11y/text-contrast":{title:"Contraste insuffisant",message:"Contraste {ratio} entre {fg} et {bg} ; minimum requis : {required} pour {size} px.",why:"Sous le seuil WCAG AA, une partie des utilisateurs ne peut pas lire ce texte, notamment en plein soleil ou avec une basse vision.",suggestion:{default:"Assombrir ou \xE9claircir le texte ou le fond. Token conforme le plus proche : \xAB {suggestion} \xBB.",none:"Assombrir ou \xE9claircir le texte ou le fond jusqu\u2019\xE0 atteindre {required}."}},"a11y/contrast-not-verifiable":{title:"Contraste non v\xE9rifiable",message:{image:"Le texte repose sur une image : le contraste n\u2019est pas calculable automatiquement.",gradient:"Le texte repose sur un d\xE9grad\xE9 : le contraste n\u2019est pas calculable automatiquement.",opacity:"Un parent semi-transparent emp\xEAche de conna\xEEtre le fond r\xE9el.",mixed:"Ce texte m\xE9lange plusieurs couleurs.",default:"Le fond r\xE9el ne peut pas \xEAtre d\xE9termin\xE9."},why:"Le plugin n\u2019invente pas de r\xE9sultat : v\xE9rifie ce texte manuellement.",suggestion:"Ajouter un voile ou un fond uni derri\xE8re le texte, puis relancer l\u2019analyse."},"a11y/touch-target":{title:"Zone tactile trop petite",message:"{width} \xD7 {height} px : la cible interactive fait moins de {min} px.",why:"Les cibles trop petites provoquent des erreurs de clic, surtout sur mobile et pour les personnes avec des troubles moteurs (WCAG 2.5.8).",suggestion:"Agrandir la zone cliquable \xE0 au moins {min} \xD7 {min} px, m\xEAme si l\u2019ic\xF4ne reste petite."},"a11y/text-too-small":{title:"Texte trop petit",message:"{value} : en dessous du minimum recommand\xE9 de {min} px.",why:"Les petits textes sont les premiers illisibles sur mobile et pour les personnes avec une basse vision.",suggestion:"Monter \xE0 {min} px minimum, ou r\xE9server cette taille aux mentions secondaires."},"handoff/fractional-size":{title:"Dimension non arrondie",message:"{value} : des fractions de pixel qui n\u2019existent pas en CSS.",why:"Les valeurs d\xE9cimales produisent du flou, des arrondis incoh\xE9rents et des specs illisibles.",suggestion:"Arrondir \xE0 l\u2019entier le plus proche."},"handoff/fractional-position":{title:"Position non arrondie",message:"{value} : le calque n\u2019est pas sur la grille de pixels.",why:"Un calque \xE0 mi-pixel se rend flou et d\xE9cale les mesures dans le mode Dev.",suggestion:"Arrondir la position \xE0 l\u2019entier le plus proche."},"handoff/stackable-without-autolayout":{title:"Pile sans auto layout",message:"{count} enfants align\xE9s en {direction} sans auto layout.",why:"Un empilement manuel ne s\u2019adapte ni au contenu ni aux largeurs : les devs devront deviner le flex.",suggestion:"Activer l\u2019auto layout (\u21E7 A) et v\xE9rifier le gap."},"tokens/broken-alias":{title:"Alias cass\xE9",message:"\xAB {name} \xBB pointe vers une variable introuvable (mode {mode}).",why:"Un alias cass\xE9 rend la valeur impr\xE9visible : Figma garde la derni\xE8re valeur connue, le code n\u2019aura rien.",suggestion:"R\xE9tablir l\u2019alias vers le token voulu, ou remplacer par une valeur explicite."},"tokens/circular-alias":{title:"Alias circulaire",message:"{chain} : la cha\xEEne d\u2019alias revient sur elle-m\xEAme.",why:"Une boucle n\u2019a pas de valeur finale ; chaque consommateur peut la r\xE9soudre diff\xE9remment.",suggestion:"Faire pointer le dernier maillon vers un token primitif."},"tokens/orphan":{title:"Token jamais utilis\xE9",message:"\xAB {name} \xBB n\u2019est li\xE9 \xE0 aucun calque du fichier et aucun autre token ne l\u2019alias.",why:"Un token mort encombre les pickers et finit par diverger du syst\xE8me.",suggestion:"Supprimer le token, ou l\u2019utiliser l\xE0 o\xF9 sa valeur est cod\xE9e en dur."},"tokens/duplicate-value":{title:"Tokens de m\xEAme valeur",message:"\xAB {name} \xBB a exactement la m\xEAme valeur que {others}.",why:"Deux noms pour une valeur : on choisit au hasard, et une mise \xE0 jour ne touche que la moiti\xE9 des usages.",suggestion:"Faire de l\u2019un un alias de l\u2019autre, ou les fusionner si leurs r\xF4les sont identiques."},"tokens/primitive-bound":{title:"Token primitif utilis\xE9 directement",message:{exact:"{token} est un token de palette ; \xAB {semantic} \xBB porte la m\xEAme valeur avec un r\xF4le explicite.",none:"{token} est un token de palette appliqu\xE9 directement \xE0 un calque."},why:"Les primitifs d\xE9crivent une valeur, pas un usage : si la marque change, les calques li\xE9s \xE0 blue/500 ne suivent pas le bon r\xF4le.",suggestion:"Lier au token s\xE9mantique correspondant (action, texte, surface, bordure)."},"tokens/mode-gap":{title:"Mode non couvert",message:"\xAB {name} \xBB a la m\xEAme valeur dans tous les modes ({modes}) alors que \xAB {collection} \xBB varie par mode.",why:"Un token identique en clair et en sombre est souvent un oubli : il rendra un \xE9l\xE9ment illisible dans l\u2019un des modes.",suggestion:"D\xE9finir une valeur par mode, ou documenter que le token est volontairement constant."},"tokens/unscoped":{title:"Token sans scope",message:"\xAB {name} \xBB est utilisable partout alors que la plupart des couleurs du fichier sont scop\xE9es.",why:"Les scopes emp\xEAchent d\u2019appliquer une couleur de texte comme fond : sans scope, le picker propose tout \xE0 tout le monde.",suggestion:"Restreindre le scope du token \xE0 ses usages r\xE9els."},"typography/near-duplicate-styles":{title:"Styles de texte quasi identiques",message:"\xAB {a} \xBB et \xAB {b} \xBB : m\xEAme police ({font}), {sizeA} et {sizeB} px.",why:"Deux styles presque \xE9gaux brouillent la hi\xE9rarchie et doublent la maintenance.",suggestion:"Fusionner les deux styles ou accentuer leur diff\xE9rence (taille, graisse, r\xF4le)."},"typography/line-length":{title:"Ligne trop longue",message:"Environ {chars} caract\xE8res par ligne sur {width} px (recommand\xE9 : {max} au plus).",why:"Au-del\xE0 de 70 \xE0 80 caract\xE8res, l\u2019\u0153il perd la ligne suivante : la lecture ralentit.",suggestion:"R\xE9duire la largeur du bloc, augmenter la taille, ou passer en colonnes."},"typography/line-height-inconsistent":{title:"Interligne incoh\xE9rent",message:"{family} {size} px avec un interligne de {lineHeight} px ; {count} autres textes utilisent {mode} px.",why:"M\xEAme taille, m\xEAme rythme vertical : un interligne diff\xE9rent d\xE9cale les alignements d\u2019une carte \xE0 l\u2019autre.",suggestion:"Harmoniser \xE0 {mode} px, id\xE9alement via un style de texte."},"typography/label-case":{title:"Casse de libell\xE9 incoh\xE9rente",message:"\xAB {text} \xBB ne suit pas la casse majoritaire des libell\xE9s ({share} %).",why:"La casse fait partie de la voix du produit : la m\xE9langer donne une impression de hasard.",suggestion:"\xC9crire \xAB {suggested} \xBB."},"spacing/rhythm-near-miss":{title:"Rythme presque identique",message:"Gap de {gap} px sur \xAB {role} \xBB ; les {count} conteneurs \xE9quivalents utilisent surtout {mode} px.",why:"16 et 18 px dans des contextes \xE9quivalents ne se voient pas isol\xE9ment, mais cassent l\u2019alignement global.",suggestion:"Harmoniser le gap \xE0 {mode} px."},"spacing/fixed-should-fill":{title:"Dimension fixe \xE0 passer en Fill",message:{width:"Largeur fixe de {size} px, \xE9gale \xE0 l\u2019espace disponible dans \xAB {parent} \xBB.",height:"Hauteur fixe de {size} px, \xE9gale \xE0 l\u2019espace disponible dans \xAB {parent} \xBB."},why:"Une dimension fixe qui co\xEFncide avec le parent ne suivra pas un redimensionnement : le d\xE9veloppeur devra deviner un flex: 1.",suggestion:"Passer le redimensionnement en Fill container."},"spacing/fixed-should-hug":{title:"Dimension fixe \xE0 passer en Hug",message:{width:"Largeur fixe de {size} px, exactement \xE9gale au contenu.",height:"Hauteur fixe de {size} px, exactement \xE9gale au contenu."},why:"Un conteneur fixe qui colle \xE0 son contenu se cassera au premier texte plus long.",suggestion:"Passer l\u2019axe en Hug contents."},"spacing/text-overlap":{title:"Textes qui se chevauchent",message:"Chevauche \xAB {other} \xBB sur {dx} \xD7 {dy} px.",why:"Deux textes superpos\xE9s sont presque toujours un accident : illisible \xE0 l\u2019\xE9cran, ambigu pour le d\xE9veloppeur.",suggestion:"D\xE9placer l\u2019un des textes ou passer le parent en auto layout."},"components/deprecated-in-use":{title:"Composant obsol\xE8te utilis\xE9",message:"Instance de \xAB {component} \xBB, marqu\xE9 comme obsol\xE8te.",why:"Un composant d\xE9pr\xE9ci\xE9 ne re\xE7oit plus de corrections : l\u2019\xE9cran divergera du syst\xE8me.",suggestion:"Remplacer l\u2019instance par le composant qui le remplace."},"components/orphan-variant":{title:"Variante jamais utilis\xE9e",message:"\xAB {variant} \xBB de \xAB {component} \xBB n\u2019a aucune instance dans le fichier.",why:"Une variante sans usage est soit un oubli d\u2019int\xE9gration, soit du poids mort \xE0 maintenir.",suggestion:"Utiliser la variante l\xE0 o\xF9 elle est attendue, ou la retirer du jeu."},"components/useless-nesting":{title:"Conteneur sans r\xF4le",message:{group:"Groupe contenant un seul calque : \xAB {child} \xBB.",frame:"Frame sans fond, bordure ni layout, contenant un seul calque : \xAB {child} \xBB."},why:"Chaque niveau inutile alourdit le calque, le handoff et la navigation.",suggestion:"D\xE9grouper ou supprimer le conteneur."},"components/no-doc-link":{title:"Composant sans lien de documentation",message:"\xAB {component} \xBB n\u2019a pas de lien de documentation alors que d\u2019autres composants en ont.",why:"Le lien de doc est ce que voient les d\xE9veloppeurs dans Dev Mode : sans lui, ils devinent les r\xE8gles d\u2019usage.",suggestion:"Ajouter un lien de documentation dans les propri\xE9t\xE9s du composant."},"components/no-status":{title:"Composant sans statut",message:"\xAB {component} \xBB n\u2019indique pas de statut alors que le fichier en utilise (ex. \xAB {example} \xBB).",why:"Sans statut, impossible de savoir si un composant est pr\xEAt, en revue ou \xE0 \xE9viter.",suggestion:"Ajouter le statut dans le nom ou la description, comme les autres composants."},"a11y/heading-skip":{title:"Niveau de titre saut\xE9",message:"Passage de H{prev} \xE0 H{level} ; H{expected} \xE9tait attendu.",why:"Les lecteurs d\u2019\xE9cran s\u2019appuient sur la hi\xE9rarchie des titres pour naviguer : un saut d\xE9soriente.",suggestion:"Utiliser le style de titre de niveau H{expected}, ou revoir la structure."},"a11y/icon-contrast":{title:"Contraste d\u2019ic\xF4ne insuffisant",message:"Contraste {ratio} entre {fg} et {bg} ; minimum {required} pour un \xE9l\xE9ment graphique.",why:"WCAG 1.4.11 : une ic\xF4ne interactive doit rester distinguable de son fond.",suggestion:"Assombrir ou \xE9claircir l\u2019ic\xF4ne pour atteindre 3:1."},"a11y/border-contrast":{title:"Bordure de champ peu contrast\xE9e",message:"Contraste {ratio} entre la bordure {stroke} et le fond {bg} ; minimum {required}.",why:"La bordure est souvent le seul indice visuel d\u2019un champ : trop p\xE2le, le champ dispara\xEEt.",suggestion:"Renforcer la bordure pour atteindre 3:1."},"a11y/icon-only-without-label":{title:"Bouton ic\xF4ne sans libell\xE9",message:"\xAB {name} \xBB est interactif, sans texte, et son nom n\u2019indique pas son action.",why:"Le nom du calque devient le libell\xE9 accessible au handoff : \xAB Icon button \xBB ne dit rien \xE0 un lecteur d\u2019\xE9cran.",suggestion:"Nommer le calque par son action (\xAB Fermer \xBB, \xAB Rechercher \xBB) et pr\xE9voir un tooltip ou un aria-label."},"a11y/color-only-status":{title:"Statut port\xE9 par la couleur seule",message:"Texte li\xE9 \xE0 \xAB {token} \xBB sans ic\xF4ne ni autre indice que la couleur.",why:"Environ 8 % des hommes distinguent mal le rouge du vert : la couleur ne peut pas \xEAtre le seul signal.",suggestion:"Ajouter une ic\xF4ne, un pr\xE9fixe ou une mise en forme."},"handoff/repeated-pattern":{title:"Motif r\xE9p\xE9t\xE9 non composantis\xE9",message:"{count} calques identiques \xAB {name} \xBB dans \xAB {parent} \xBB.",why:"R\xE9p\xE9ter une structure \xE0 la main multiplie les \xE9carts et les retouches ; le d\xE9veloppeur y verra un composant \xE0 cr\xE9er.",suggestion:"Cr\xE9er un composant et remplacer les r\xE9p\xE9titions par des instances."},"handoff/image-crop":{title:"Image recadr\xE9e \xE0 la main",message:"\xAB {name} \xBB utilise un recadrage manuel (Crop).",why:"Le crop Figma n\u2019a pas d\u2019\xE9quivalent direct en CSS : la position de l\u2019image sera r\xE9interpr\xE9t\xE9e.",suggestion:"Pr\xE9f\xE9rer Fill ou Fit avec un ratio de conteneur, ou exporter l\u2019image recadr\xE9e."},"craft/missing-success-state":{title:"\xC9tat de succ\xE8s manquant",message:"\xAB {component} \xBB d\xE9clenche une action longue sans \xE9tat de succ\xE8s.",why:"Apr\xE8s un pa
