<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Senior Check Design</title>
    <style>
      /* ---------------------------------------------------------------------------
   Senior Check Design — UI
   Thème : variables Figma (themeColors: true) avec repli pour l'aperçu navigateur.
   --------------------------------------------------------------------------- */
:root {
  --bg: var(--figma-color-bg, #ffffff);
  --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
  --bg-3: var(--figma-color-bg-tertiary, #e6e6e6);
  --bg-hover: var(--figma-color-bg-hover, rgba(0, 0, 0, 0.06));
  --bg-pressed: var(--figma-color-bg-pressed, rgba(0, 0, 0, 0.1));
  --bg-selected: var(--figma-color-bg-selected, #e5f4ff);
  --bg-brand: var(--figma-color-bg-brand, #0d99ff);
  --bg-brand-hover: var(--figma-color-bg-brand-hover, #007be5);
  --bg-brand-3: var(--figma-color-bg-brand-tertiary, #e5f4ff);
  --bg-danger: var(--figma-color-bg-danger, #f24822);
  --bg-danger-3: var(--figma-color-bg-danger-tertiary, #ffe2e0);
  --bg-warning: var(--figma-color-bg-warning, #ffcd29);
  --bg-warning-3: var(--figma-color-bg-warning-tertiary, #fff1c2);
  --bg-success: var(--figma-color-bg-success, #14ae5c);
  --bg-success-3: var(--figma-color-bg-success-tertiary, #cff7d3);
  --bg-component-3: var(--figma-color-bg-component-tertiary, #f0e9ff);
  --bg-inverse: var(--figma-color-bg-inverse, #2c2c2c);
  --bg-disabled: var(--figma-color-bg-disabled, #e6e6e6);
  --text: var(--figma-color-text, rgba(0, 0, 0, 0.9));
  --text-2: var(--figma-color-text-secondary, rgba(0, 0, 0, 0.5));
  --text-3: var(--figma-color-text-tertiary, rgba(0, 0, 0, 0.3));
  --text-brand: var(--figma-color-text-brand, #007be5);
  --text-danger: var(--figma-color-text-danger, #dc3412);
  --text-warning: var(--figma-color-text-warning, #a8720b);
  --text-success: var(--figma-color-text-success, #0a8a4a);
  --text-component: var(--figma-color-text-component, #7a3ef0);
  --text-onbrand: var(--figma-color-text-onbrand, #ffffff);
  --text-oninverse: var(--figma-color-text-oninverse, #ffffff);
  --text-disabled: var(--figma-color-text-disabled, rgba(0, 0, 0, 0.3));
  --border: var(--figma-color-border, #e6e6e6);
  --border-strong: var(--figma-color-border-strong, #2c2c2c);
  --border-brand: var(--figma-color-border-brand, #0d99ff);
  --border-selected: var(--figma-color-border-selected, #0d99ff);
  --icon: var(--figma-color-icon, rgba(0, 0, 0, 0.9));
  --icon-2: var(--figma-color-icon-secondary, rgba(0, 0, 0, 0.5));

  --radius-s: 4px;
  --radius-m: 6px;
  --radius-l: 10px;
  --font: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace;
  --fs-xs: 10px;
  --fs-s: 11px;
  --fs-m: 12px;
  --fs-l: 13px;
  --fs-xl: 16px;
  --fs-score: 28px;

  --d-fast: 100ms;
  --d-fix: 180ms;
  --d-count: 300ms;
  --d-panel: 200ms;
  --d-toast-in: 180ms;
  --d-toast-out: 140ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --shadow-1: 0 1px 3px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.06);
  --shadow-2: 0 6px 20px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.08);
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--border-brand);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --d-fast: 0ms;
    --d-fix: 0ms;
    --d-count: 0ms;
    --d-panel: 0ms;
    --d-toast-in: 0ms;
    --d-toast-out: 0ms;
  }
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}
body {
  font: 400 var(--fs-s) / 1.45 var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
}
button:disabled {
  cursor: default;
}
:focus {
  outline: none;
}
:focus-visible {
  box-shadow: var(--focus-ring);
  border-radius: var(--radius-s);
}
.num,
.score-value,
.count,
.value {
  font-variant-numeric: tabular-nums;
}
.mono {
  font-family: var(--mono);
  font-size: var(--fs-xs);
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* ---- Layout ------------------------------------------------------------ */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}
.screen {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  animation: screen-in var(--d-panel) var(--ease-out);
}
@keyframes screen-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header .title {
  font-weight: 600;
  font-size: var(--fs-m);
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header .sub {
  color: var(--text-2);
  font-weight: 400;
  margin-left: 6px;
}
.footer {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
  align-items: center;
}
.footer .spacer {
  flex: 1;
}
.section {
  padding: 12px;
}
.section + .section {
  border-top: 1px solid var(--border);
}
.section-title {
  font-size: var(--fs-s);
  font-weight: 600;
  margin: 0 0 8px;
  color: var(--text);
}
.hint {
  color: var(--text-2);
  font-size: var(--fs-xs);
  line-height: 1.4;
}
.row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.muted {
  color: var(--text-2);
}

/* ---- Buttons ----------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border-radius: var(--radius-m);
  font-weight: 500;
  font-size: var(--fs-s);
  border: 1px solid transparent;
  transition:
    background var(--d-fast) var(--ease-out),
    border-color var(--d-fast) var(--ease-out),
    color var(--d-fast) var(--ease-out),
    transform var(--d-fast) var(--ease-out);
  white-space: nowrap;
}
.btn:active:not(:disabled) {
  transform: translateY(0.5px);
}
.btn-primary {
  background: var(--bg-brand);
  color: var(--text-onbrand);
}
.btn-primary:hover:not(:disabled) {
  background: var(--bg-brand-hover);
}
.btn-primary:disabled {
  background: var(--bg-disabled);
  color: var(--text-disabled);
}
.btn-secondary {
  border-color: var(--border);
  background: var(--bg);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--bg-hover);
}
.btn-ghost {
  color: var(--text-2);
  padding: 0 8px;
}
.btn-ghost:hover:not(:disabled) {
  background: var(--bg-hover);
  color: var(--text);
}
.btn-success {
  background: var(--bg-success);
  color: #fff;
}
.btn-success:hover:not(:disabled) {
  filter: brightness(0.95);
}
.btn-sm {
  height: 24px;
  padding: 0 8px;
  font-size: var(--fs-xs);
  border-radius: var(--radius-s);
}
.btn-icon {
  width: 28px;
  height: 28px;
  padding: 0;
  border-radius: var(--radius-s);
  color: var(--icon-2);
}
.btn-icon:hover {
  background: var(--bg-hover);
  color: var(--icon);
}
.btn-block {
  width: 100%;
}
.icon {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

/* ---- Form controls ----------------------------------------------------- */
.select {
  position: relative;
}
.select select {
  appearance: none;
  width: 100%;
  height: 32px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  background: var(--bg);
  color: var(--text);
}
.select select:hover {
  border-color: var(--border-strong);
}
.select::after {
  content: '';
  position: absolute;
  right: 11px;
  top: 12px;
  width: 6px;
  height: 6px;
  border-right: 1.5px solid var(--icon-2);
  border-bottom: 1.5px solid var(--icon-2);
  transform: rotate(45deg);
  pointer-events: none;
}
.segmented {
  display: flex;
  background: var(--bg-2);
  border-radius: var(--radius-m);
  padding: 2px;
  gap: 2px;
}
.segmented button {
  flex: 1;
  height: 26px;
  border-radius: var(--radius-s);
  color: var(--text-2);
  font-weight: 500;
  transition:
    background var(--d-fast) var(--ease-out),
    color var(--d-fast) var(--ease-out);
}
.segmented button:hover {
  color: var(--text);
}
.segmented button[aria-pressed='true'] {
  background: var(--bg);
  color: var(--text);
  box-shadow: var(--shadow-1);
}
.segmented button:disabled {
  color: var(--text-disabled);
}
.check {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 26px;
  cursor: pointer;
}
.check input {
  appearance: none;
  width: 14px;
  height: 14px;
  margin: 0;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  background: var(--bg);
  display: grid;
  place-items: center;
  transition: background var(--d-fast) var(--ease-out);
  flex-shrink: 0;
}
.check input:checked {
  background: var(--bg-brand);
  border-color: var(--bg-brand);
}
.check input:checked::after {
  content: '';
  width: 4px;
  height: 7px;
  border: solid #fff;
  border-width: 0 1.5px 1.5px 0;
  transform: translateY(-1px) rotate(45deg);
}
.check input:focus-visible {
  box-shadow: var(--focus-ring);
}
.field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  height: 28px;
}
.field input[type='number'] {
  width: 64px;
  height: 26px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  background: var(--bg);
  text-align: right;
}
.search {
  position: relative;
}
.search input {
  width: 100%;
  height: 30px;
  padding: 0 28px 0 28px;
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  background: var(--bg);
}
.search input:focus {
  border-color: var(--border-brand);
}
.search .icon {
  position: absolute;
  left: 9px;
  top: 8px;
  color: var(--icon-2);
}
.search .kbd {
  position: absolute;
  right: 8px;
  top: 7px;
}
.kbd {
  font: 500 var(--fs-xs) / 1 var(--mono);
  color: var(--text-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px 4px;
  background: var(--bg-2);
}
details.accordion summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-2);
  font-weight: 500;
  height: 24px;
}
details.accordion summary::-webkit-details-marker {
  display: none;
}
details.accordion summary::before {
  content: '';
  width: 5px;
  height: 5px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg);
  transition: transform var(--d-fast) var(--ease-out);
  margin-left: 2px;
}
details.accordion[open] summary::before {
  transform: rotate(45deg);
}
details.accordion .body {
  padding-top: 6px;
}

/* ---- Preset cards ------------------------------------------------------ */
.preset-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.preset-card {
  text-align: left;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  background: var(--bg);
  transition:
    border-color var(--d-fast) var(--ease-out),
    background var(--d-fast) var(--ease-out);
}
.preset-card:hover {
  background: var(--bg-hover);
}
.preset-card[aria-pressed='true'] {
  border-color: var(--border-brand);
  background: var(--bg-brand-3);
}
.preset-card .name {
  font-weight: 600;
  display: block;
}
.preset-card .desc {
  color: var(--text-2);
  font-size: var(--fs-xs);
  display: block;
  margin-top: 1px;
}
.rule-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 180px;
  overflow: auto;
  padding-right: 4px;
}
.rule-list .check {
  height: 24px;
  font-size: var(--fs-xs);
}
.rule-list .cat {
  color: var(--text-3);
  margin-left: auto;
}

/* ---- Scanning ---------------------------------------------------------- */
.progress-wrap {
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.progress-title {
  font-size: var(--fs-l);
  font-weight: 600;
}
.progress-phase {
  color: var(--text-2);
  min-height: 16px;
}
.bar {
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--bg-brand);
  border-radius: 2px;
  transition: width 120ms linear;
}
.bar.indeterminate > i {
  width: 40%;
  animation: slide 1.1s var(--ease-out) infinite;
}
@keyframes slide {
  from {
    transform: translateX(-120%);
  }
  to {
    transform: translateX(300%);
  }
}
.found-grid {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  color: var(--text-2);
}
.found-grid .count {
  color: var(--text);
  font-weight: 500;
  text-align: right;
  transition: color var(--d-fix) var(--ease-out);
}

/* ---- Score card -------------------------------------------------------- */
.score-card {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 14px;
  align-items: center;
  padding: 12px;
  margin: 10px 12px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-l);
  background: var(--bg);
}
.score-ring {
  width: 56px;
  height: 56px;
  position: relative;
  grid-row: span 2;
}
.score-ring svg {
  transform: rotate(-90deg);
}
.score-ring circle {
  fill: none;
  stroke-width: 4;
}
.score-ring .track {
  stroke: var(--bg-3);
}
.score-ring .fill {
  stroke: var(--bg-success);
  stroke-linecap: round;
  transition: stroke-dashoffset var(--d-count) var(--ease-out), stroke var(--d-count) var(--ease-out);
}
.score-ring[data-level='mid'] .fill {
  stroke: var(--bg-warning);
}
.score-ring[data-level='low'] .fill {
  stroke: var(--bg-danger);
}
.score-value {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: var(--fs-xl);
  font-weight: 600;
  letter-spacing: -0.02em;
}
.score-label {
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.score-label .tag {
  margin-left: auto;
}
.score-meta {
  color: var(--text-2);
  font-size: var(--fs-xs);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 18px;
  padding: 0 6px;
  border-radius: 9px;
  font-size: var(--fs-xs);
  font-weight: 500;
  background: var(--bg-2);
  color: var(--text-2);
  white-space: nowrap;
}
.tag-error {
  background: var(--bg-danger-3);
  color: var(--text-danger);
}
.tag-warning {
  background: var(--bg-warning-3);
  color: var(--text-warning);
}
.tag-info {
  background: var(--bg-brand-3);
  color: var(--text-brand);
}
.tag-safe {
  background: var(--bg-success-3);
  color: var(--text-success);
}
.tag-review {
  background: var(--bg-component-3);
  color: var(--text-component);
}
.tag-fixed {
  background: var(--bg-success-3);
  color: var(--text-success);
}

/* ---- Chips ------------------------------------------------------------- */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 10px 12px 0;
}
.chip {
  height: 24px;
  padding: 0 8px;
  border-radius: 12px;
  border: 1px solid var(--border);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--text-2);
  background: var(--bg);
  transition:
    background var(--d-fast) var(--ease-out),
    border-color var(--d-fast) var(--ease-out),
    color var(--d-fast) var(--ease-out),
    opacity var(--d-fix) var(--ease-out);
}
.chip:hover {
  background: var(--bg-hover);
  color: var(--text);
}
.chip[aria-pressed='true'] {
  background: var(--bg-inverse);
  color: var(--text-oninverse);
  border-color: var(--bg-inverse);
}
.chip .count {
  font-weight: 600;
  min-width: 10px;
  text-align: center;
}
.chip.empty {
  opacity: 0.45;
}
.chip-fill {
  animation: chip-pop var(--d-fix) var(--ease-out);
}
@keyframes chip-pop {
  from {
    transform: scale(0.96);
    opacity: 0.6;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
.toolbar {
  display: flex;
  gap: 6px;
  padding: 8px 12px;
  align-items: center;
}
.toolbar .search {
  flex: 1;
}
.toolbar .select select {
  height: 30px;
  font-size: var(--fs-xs);
  padding-right: 24px;
}
.toolbar .select::after {
  top: 11px;
}

/* ---- Issue list -------------------------------------------------------- */
.list {
  padding: 0 0 8px;
}
.cat-head {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 4px;
  background: var(--bg);
  font-weight: 600;
  font-size: var(--fs-xs);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text-2);
}
.cat-head .count {
  color: var(--text-3);
  font-weight: 500;
}
.group {
  margin: 0 8px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  overflow: hidden;
  background: var(--bg);
}
.group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  text-align: left;
  transition: background var(--d-fast) var(--ease-out);
}
.group-head:hover {
  background: var(--bg-hover);
}
.group-head .caret {
  width: 5px;
  height: 5px;
  border-right: 1.5px solid var(--icon-2);
  border-bottom: 1.5px solid var(--icon-2);
  transform: rotate(-45deg);
  transition: transform var(--d-fast) var(--ease-out);
  flex-shrink: 0;
  margin: 0 3px;
}
.group[data-open='true'] .group-head .caret {
  transform: rotate(45deg);
}
.group-head .g-title {
  font-weight: 600;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.group-head .g-count {
  color: var(--text-2);
  font-size: var(--fs-xs);
}
.group-value {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px 8px 24px;
  color: var(--text-2);
  font-size: var(--fs-xs);
  flex-wrap: wrap;
}
.group-value .arrow {
  color: var(--text-3);
}
.swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
  flex-shrink: 0;
  background-image: linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%),
    linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%);
  background-size: 6px 6px;
  background-position:
    0 0,
    3px 3px;
  position: relative;
  overflow: hidden;
}
.swatch > i {
  position: absolute;
  inset: 0;
}
.value {
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--text);
}
.group-actions {
  display: flex;
  gap: 6px;
  padding: 0 10px 8px 24px;
}
.issues {
  border-top: 1px solid var(--border);
  background: var(--bg-2);
}
.issue {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 6px 10px 6px 12px;
  border-top: 1px solid var(--border);
  cursor: pointer;
  transition:
    background var(--d-fix) var(--ease-out),
    opacity var(--d-fix) var(--ease-out);
  position: relative;
}
.issue:first-child {
  border-top: 0;
}
.issue:hover,
.issue:focus-visible {
  background: var(--bg-hover);
  box-shadow: none;
}
.issue[aria-selected='true'] {
  background: var(--bg-selected);
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-3);
  transition: background var(--d-fix) var(--ease-out);
}
.dot-error {
  background: var(--bg-danger);
}
.dot-warning {
  background: var(--bg-warning);
}
.dot-info {
  background: var(--bg-brand);
}
.issue .meta {
  min-width: 0;
}
.issue .name {
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.issue .path {
  color: var(--text-2);
  font-size: var(--fs-xs);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}
.issue .path > span {
  direction: ltr;
  unicode-bidi: embed;
}
.issue .actions {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity var(--d-fast) var(--ease-out);
}
.issue:hover .actions,
.issue:focus-within .actions,
.issue[aria-selected='true'] .actions {
  opacity: 1;
}
.issue.is-fixed,
.issue.is-ignored {
  opacity: 0.55;
}
.issue.is-fixed .dot {
  background: var(--bg-success);
}
.issue.is-fixed .name {
  text-decoration: line-through;
  text-decoration-color: var(--text-3);
}
.issue.just-fixed {
  animation: fixed-flash var(--d-fix) var(--ease-out);
}
@keyframes fixed-flash {
  from {
    background: var(--bg-success-3);
  }
  to {
    background: transparent;
  }
}
.issue .state {
  font-size: var(--fs-xs);
  color: var(--text-success);
  font-weight: 500;
}
.issue.is-ignored .state {
  color: var(--text-2);
}

/* ---- Empty / error states --------------------------------------------- */
.state-box {
  padding: 32px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.state-box .big-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--bg-success-3);
  color: var(--text-success);
  margin-bottom: 4px;
}
.state-box .big-icon.warn {
  background: var(--bg-warning-3);
  color: var(--text-warning);
}
.state-box .big-icon.neutral {
  background: var(--bg-2);
  color: var(--text-2);
}
.state-box h2 {
  margin: 0;
  font-size: var(--fs-l);
  font-weight: 600;
}
.state-box p {
  margin: 0;
  color: var(--text-2);
  max-width: 300px;
}
.state-box .row {
  margin-top: 8px;
}
.notice {
  margin: 8px 12px 0;
  padding: 8px 10px;
  border-radius: var(--radius-m);
  background: var(--bg-warning-3);
  color: var(--text-warning);
  font-size: var(--fs-xs);
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.notice.info {
  background: var(--bg-2);
  color: var(--text-2);
}

/* ---- Detail panel ------------------------------------------------------ */
.detail {
  position: absolute;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  animation: detail-in var(--d-panel) var(--ease-out);
  z-index: 5;
}
@keyframes detail-in {
  from {
    transform: translateX(24px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
.detail.leaving {
  animation: detail-out var(--d-panel) var(--ease-in) forwards;
}
@keyframes detail-out {
  to {
    transform: translateX(24px);
    opacity: 0;
  }
}
.detail h1 {
  font-size: var(--fs-l);
  font-weight: 600;
  margin: 0 0 6px;
}
.detail .tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.kv {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.kv .k {
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  margin-bottom: 3px;
}
.kv .v {
  color: var(--text);
}
.compare {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: center;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  background: var(--bg-2);
}
.compare .cell {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.compare .cell .swatch {
  width: 16px;
  height: 16px;
  border-radius: 4px;
}
.compare .cell .txt {
  min-width: 0;
}
.compare .cell .main {
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.compare .cell .sub {
  color: var(--text-2);
  font-size: var(--fs-xs);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.compare .arrow {
  color: var(--text-3);
}
.alt-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.alt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  background: var(--bg);
  width: 100%;
  text-align: left;
}
.alt:hover {
  background: var(--bg-hover);
}
.alt .main {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.alt .sub {
  color: var(--text-2);
  font-size: var(--fs-xs);
}
.path-list {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 4px;
  color: var(--text-2);
}
.path-list .sep {
  color: var(--text-3);
}
.path-list .last {
  color: var(--text);
  font-weight: 500;
}
.detail .footer {
  flex-wrap: wrap;
}
.detail .footer .btn {
  flex: 1 1 auto;
}

/* ---- Dialog / confirm -------------------------------------------------- */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.3);
  display: grid;
  place-items: center;
  z-index: 20;
  animation: fade-in var(--d-fast) var(--ease-out);
  padding: 16px;
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.dialog {
  background: var(--bg);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-2);
  padding: 16px;
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: screen-in var(--d-panel) var(--ease-out);
}
.dialog h2 {
  margin: 0;
  font-size: var(--fs-l);
}
.dialog p {
  margin: 0;
  color: var(--text-2);
}
.dialog .row {
  justify-content: flex-end;
  margin-top: 4px;
}

/* ---- Toasts ------------------------------------------------------------ */
.toasts {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 56px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 30;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 8px 12px;
  border-radius: var(--radius-m);
  background: var(--bg-inverse);
  color: var(--text-oninverse);
  box-shadow: var(--shadow-2);
  animation: toast-in var(--d-toast-in) var(--ease-out);
  font-size: var(--fs-xs);
}
.toast.leaving {
  animation: toast-out var(--d-toast-out) var(--ease-in) forwards;
}
@keyframes toast-in {
  from {
    transform: translateY(8px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes toast-out {
  to {
    transform: translateY(6px);
    opacity: 0;
  }
}
.toast .msg {
  flex: 1;
  min-width: 0;
}
.toast .btn {
  height: 24px;
  padding: 0 8px;
  color: #8fd1ff;
  font-weight: 600;
}
.toast .btn:hover {
  background: rgba(255, 255, 255, 0.1);
}
.toast .progress {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  background: rgba(255, 255, 255, 0.35);
  width: 100%;
  transform-origin: left;
  border-radius: 0 0 var(--radius-m) var(--radius-m);
}
.toast {
  position: relative;
  overflow: hidden;
}

/* ---- Resize handle ----------------------------------------------------- */
.resize-handle {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 16px;
  height: 16px;
  cursor: nwse-resize;
  z-index: 40;
  opacity: 0.5;
}
.resize-handle::before {
  content: '';
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: 6px;
  height: 6px;
  border-right: 1.5px solid var(--icon-2);
  border-bottom: 1.5px solid var(--icon-2);
}
.resize-handle:hover {
  opacity: 1;
}

/* ---- Keyboard hint ----------------------------------------------------- */
.kbd-hint {
  color: var(--text-3);
  font-size: var(--fs-xs);
  padding: 4px 12px 0;
  text-align: center;
}

@keyframes shrink {
  to {
    transform: scaleX(0);
  }
}
.toast:hover .progress {
  animation-play-state: paused;
}
.issue .btn-icon {
  width: 24px;
  height: 24px;
}
.issue .btn-icon .icon {
  width: 13px;
  height: 13px;
}
.fix-progress {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: var(--fs-xs);
  color: var(--text-2);
}
.menu {
  position: absolute;
  right: 12px;
  top: 40px;
  background: var(--bg);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-2);
  padding: 4px;
  z-index: 25;
  display: flex;
  flex-direction: column;
  min-width: 180px;
  animation: screen-in var(--d-fast) var(--ease-out);
}
.menu button {
  text-align: left;
  padding: 7px 10px;
  border-radius: var(--radius-s);
  display: flex;
  align-items: center;
  gap: 8px;
}
.menu button:hover {
  background: var(--bg-hover);
}
.menu .sep {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}
.scope-badge {
  font-weight: 500;
}
.sev-select {
  min-width: 96px;
}
